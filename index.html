/* ---------- split ---------- */
function shareFor(t,user){
  if(!t.shared) return t.createdBy===user?t.amount:0;
  const isC=user===t.createdBy,p=(t.splitPercent||50)/100;
  switch(t.splitMode){
    case "paid_by_me_split": case "paid_by_other_split": return t.amount*(isC?p:1-p);
    case "i_owe_full": return isC?t.amount:0;
    case "other_owes_full": return isC?0:t.amount;
    default: return 0;
  }
}
function deltaFor(t){
  if(!t.shared) return 0;
  const p=(t.splitPercent||50)/100,sign=t.type==="expense"?1:-1;
  switch(t.splitMode){
    case "paid_by_me_split": return sign*t.amount*(1-p);
    case "paid_by_other_split": return -sign*t.amount*p;
    case "i_owe_full": return -sign*t.amount;
    case "other_owes_full": return sign*t.amount;
    default: return 0;
  }
}

/* ---------- calcolatrice ---------- */
function calc(expr){
  const tk=String(expr).replace(/,/g,".").match(/(\d+\.?\d*|[+\-*/()])/g);
  if(!tk) return NaN;
  let i=0; const peek=()=>tk[i],eat=()=>tk[i++];
  function E(){let v=Tm();while(peek()==="+"||peek()==="-"){const o=eat(),r=Tm();v=o==="+"?v+r:v-r;}return v;}
  function Tm(){let v=F();while(peek()==="*"||peek()==="/"){const o=eat(),r=F();v=o==="*"?v*r:v/r;}return v;}
  function F(){ if(peek()==="("){eat();const v=E();if(peek()===")")eat();return v;}
    if(peek()==="-"){eat();return -F();}
    const n=parseFloat(eat());return isNaN(n)?0:n;}
  const r=E(); return i<tk.length?NaN:r;
}

/* ---------- condivisione file ---------- */
function scaricaFile(blob,filename){
  try{
    const a=document.createElement("a");
    a.href=URL.createObjectURL(blob); a.download=filename;
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(()=>URL.revokeObjectURL(a.href),4000);
    return true;
  }catch(e){ return false; }
}
function shareOrDownload(blob,filename,title,onFallback){
  let file=null;
  try{ file=new File([blob],filename,{type:blob.type}); }catch(e){}
  const puoCondividere = file && navigator.canShare && navigator.canShare({files:[file]}) && navigator.share;
  if(puoCondividere){
    navigator.share({files:[file],title,text:title}).catch((err)=>{
      // annullato dall'utente: non si riprova. Qualsiasi altro errore: si scarica.
      if(err && err.name==="AbortError") return;
      if(!scaricaFile(blob,filename) && onFallback) blob.text().then(onFallback).catch(()=>{});
    });
    return "share";
  }
  if(scaricaFile(blob,filename)) return "download";
  if(onFallback) blob.text().then(onFallback).catch(()=>{});
  return "fallback";
}

    return b;
  },[tx,settlements]);
  const myBalance = user==="pierangelo" ? balance : -balance;

  const mesecorrente=today().slice(0,8)+"01";
  const locked = user==="pierangelo" && config &&
    (simLock || !config.lastBackup || config.lastBackup < mesecorrente);

  /* --- scritture --- */
  const saveTx=async(t)=>{
    const db=fb.db;
    try{
      if(t.id){ const {id,...rest}=t;
        const prev=tx.find(x=>x.id===id)||{};
        await fb.updateDoc(fb.doc(db,"transactions",id),
          {...rest, editedBy: prev.createdBy!==user?user:(prev.editedBy||null), editedAt:fb.serverTimestamp()});
        say("Movimento aggiornato");
      } else {
        const {id,...rest}=t;
        await fb.addDoc(fb.collection(db,"transactions"),
          {...rest,createdBy:user,editedBy:null,source:"manual",createdAt:fb.serverTimestamp()});
        say("Movimento registrato");
      }
      setEditing(null);setView("home");
    }catch(e){say("Errore nel salvataggio: "+e.code);}
  };
  const delTx=async(id)=>{ try{ await fb.deleteDoc(fb.doc(fb.db,"transactions",id));
      setEditing(null);setView("home");say("Movimento eliminato");}catch(e){say("Errore: "+e.code);} };
  const saveCats=async(c)=>{ setCats(c); try{ await fb.setDoc(fb.doc(fb.db,"meta","categories"),c);}catch(e){say("Errore categorie: "+e.code);} };

  const doBackup=async()=>{
    const n=tx.length;
    const fn="SPENDOMETRO_backup_"+today()+"_v1_"+n+"tx.json";
    const payload={schema:1,generato:new Date().toISOString(),da:user,
      transactions:tx,settlements,balances,categories:cats,config};
    const blob=new Blob([JSON.stringify(payload,null,1)],{type:"application/json"});
    const how=shareOrDownload(blob,fn,fn.replace(".json",""),(txt)=>setBackupText({fn,txt}));
    try{ await fb.updateDoc(fb.doc(fb.db,"meta","config"),{lastBackup:today(),lastBackupBy:user}); }catch(e){}
    setSimLock(false);
    say(how==="fallback"?"Backup mostrato a schermo":(how==="download"?"Backup scaricato: "+fn:"Backup pronto"+(config?.backupEmail?": invialo a "+config.backupEmail:"")));
  };

  if(fbErr) return <div style={{padding:24}}><b>Firebase non raggiungibile.</b><pre style={{fontSize:11}}>{String(fbErr)}</pre></div>;
  if(!fb||authUser===undefined) return <Splash msg="Avvio…" />;
  if(!authUser) return <Login fb={fb} />;
  if(!UIDS[authUser.uid]) return <Splash msg="Account non autorizzato." action={()=>fb.signOut(fb.auth)} />;
  if(!ready||!cats||!config) return <Splash msg="Carico i dati…" />;

  return (
    <Guard>
    <div style={{background:T.bg,minHeight:"100vh"}}>
      <div style={{maxWidth:480,margin:"0 auto",paddingBottom:view==="add"?24:110}}>
        <div style={{background:T.brand,padding:"14px 16px",display:"flex",justifyContent:"space-between",alignItems:"center"}}>
          <div style={{color:"#fff",fontSize:19,fontWeight:800,letterSpacing:-0.5}}>Spendometro</div>
          <button onClick={()=>fb.signOut(fb.auth)} style={{background:"#33547C",color:"#fff",border:"none",padding:"6px 12px",borderRadius:20,fontSize:13,fontWeight:600}}>{USERS[user]}</button>
        </div>

        {locked ? <BackupLock onBackup={doBackup} config={config} /> : (
          <div style={{padding:"0 14px"}}>
            {view==="home" && <Home {...{tx,user,meta,myBalance,fb,settlements,say,setEditing,setView}} />}
            {view==="add" && <AddEdit {...{cats,user,initial:editing,onSave:saveTx,onDelete:delTx,onCancel:()=>{setEditing(null);setView("home");}}} />}
            {view==="report" && <Report {...{tx,user,meta,balances,fb,say}} />}
            {view==="cats" && <CatsView {...{cats,saveCats,tx,say}} />}
            {view==="data" && <DataView {...{tx,cats,meta,user,fb,doBackup,config,setSimLock,say}} />}
          </div>
        )}

        {!locked && view!=="add" && (
          <div className="safe-bottom" style={{position:"fixed",bottom:0,left:0,right:0,background:T.surface,borderTop:"1px solid "+T.line,display:"flex",maxWidth:480,margin:"0 auto",zIndex:50}}>
            {[["home","Spese"],["report","Report"],["cats","Categorie"],["data","Dati"]].map(([k,l])=>(
              <button key={k} onClick={()=>setView(k)} style={{flex:1,background:"none",border:"none",padding:"13px 4px 18px",fontSize:12,fontWeight:700,color:view===k?T.brand:T.muted}}>{l}</button>
            ))}
            <button onClick={()=>{setEditing(null);setView("add");}} style={{position:"absolute",right:12,top:-62,width:56,height:56,borderRadius:28,background:T.brand,color:"#fff",border:"3px solid "+T.bg,fontSize:30,lineHeight:1,padding:0,display:"flex",alignItems:"center",justifyContent:"center",boxShadow:"0 3px 12px rgba(0,0,0,.22)"}}><span style={{display:"block",marginTop:-2}}>+</span></button>
          </div>
        )}

        {toast && <div style={{position:"fixed",bottom:100,left:"50%",transform:"translateX(-50%)",background:T.ink,color:"#fff",padding:"10px 16px",borderRadius:10,fontSize:13,zIndex:99,maxWidth:360,textAlign:"center"}}>{toast}</div>}
        {backupText && (
          <div style={{position:"fixed",inset:0,background:"rgba(0,0,0,.5)",zIndex:95,display:"flex",alignItems:"center",justifyContent:"center",padding:16}}>
            <Card style={{maxWidth:420,width:"100%"}}>
              <div style={{fontSize:14,fontWeight:700}}>{backupText.fn}</div>
              <div style={{fontSize:12,color:T.muted,margin:"4px 0 8px"}}>Copia il testo e salvalo, oppure riprova dal telefono.</div>
              <textarea readOnly value={backupText.txt} style={{width:"100%",height:160,fontSize:10,fontFamily:"monospace",borderRadius:8,border:"1px solid "+T.line,padding:8,boxSizing:"border-box"}} />
              <div style={{marginTop:8}}><Btn onClick={()=>setBackupText(null)}>Chiudi</Btn></div>
            </Card>
          </div>
        )}
      </div>
    </div>
    </Guard>
  );
}

const Splash=({msg,action})=>(
  <div style={{background:T.brand,minHeight:"100vh",display:"flex",flexDirection:"column",justifyContent:"center",alignItems:"center",color:"#fff",padding:24}}>
    <div style={{fontSize:34,fontWeight:800,letterSpacing:-1.2}}>Spendometro</div>
    <div style={{color:"#9DB4CE",fontSize:14,marginTop:8}}>{msg}</div>
    {action && <div style={{marginTop:18,width:200}}><Btn kind="ghost" onClick={action}>Esci</Btn></div>}
  </div>
);

/* ---------- Login ---------- */
function Login({fb}){
  const [email,setEmail]=useState(""),[pw,setPw]=useState("");
  const [err,setErr]=useState(""),[busy,setBusy]=useState(false);
  const go=async()=>{
    setBusy(true);setErr("");
    try{ await fb.signInWithEmailAndPassword(fb.auth,email.trim(),pw); }
    catch(e){ setErr(e.code==="auth/invalid-credential"?"Email o password non corretti":e.code); }
    setBusy(false);
  };
  return (
    <div style={{background:T.brand,minHeight:"100vh",display:"flex",flexDirection:"column",justifyContent:"center",padding:26}}>
      <div style={{color:"#fff",fontSize:38,fontWeight:800,letterSpacing:-1.4}}>Spendometro</div>
      <div style={{color:"#9DB4CE",fontSize:14,marginBottom:28}}>Dipartimento contabile del PMAS</div>
      <input placeholder="Email" value={email} onChange={e=>setEmail(e.target.value)} type="email" autoComplete="username" style={{...sel,marginBottom:9}} />
      <input placeholder="Password" value={pw} onChange={e=>setPw(e.target.value)} type="password" autoComplete="current-password"
        onKeyDown={e=>e.key==="Enter"&&go()} style={{...sel,marginBottom:12}} />
      {err && <div style={{color:"#FFC9C0",fontSize:13,marginBottom:10}}>{err}</div>}
      <Btn onClick={go} disabled={busy||!email||!pw} style={{background:"#fff",color:T.brand}}>{busy?"Accesso…":"Entra"}</Btn>
      <button onClick={async()=>{ if(!email) return setErr("Scrivi prima l'email");
          try{ await fb.sendPasswordResetEmail(fb.auth,email.trim()); setErr("Email di reimpostazione inviata"); }catch(e){setErr(e.code);} }}
        style={{background:"none",border:"none",color:"#9DB4CE",fontSize:12.5,marginTop:16}}>Password dimenticata</button>
      <div style={{color:"#7B96B4",fontSize:11.5,marginTop:18,lineHeight:1.5}}>L'accesso si fa una volta sola. Aggiungi l'app alla schermata Home per mantenere la sessione.</div>
    </div>
  );
}

/* ---------- Blocco backup ---------- */
function BackupLock({onBackup,config}){
  return (
    <div style={{padding:20}}>
      <Card style={{background:T.warnSoft,borderColor:"#E8D9A8"}}>
        <div style={{fontSize:17,fontWeight:800,marginBottom:6}}>Backup del mese richiesto</div>
        <div style={{fontSize:13.5,lineHeight:1.55,color:"#5C4A16"}}>
          L'app resta bloccata finché non salvi il backup. Ultimo backup: <b>{config.lastBackup||"mai"}</b>.
          Premi il pulsante, scegli Mail e invia a <b>{config.backupEmail||"(imposta l'indirizzo in Dati)"}</b>.
        </div>
        <div style={{marginTop:14}}><Btn onClick={onBackup}>Backup database</Btn></div>
      </Card>
    </div>
  );
}

/* ---------- Home ---------- */
function Home({tx,user,meta,myBalance,fb,settlements,say,setEditing,setView}){
  const [scale,setScale]=useState("mese");
  const [confirm,setConfirm]=useState(false);
  const scroller=useRef(null);
  const mine=useMemo(()=>tx.map(t=>({t,q:shareFor(t,user)})).filter(x=>x.q>0.0001),[tx,user]);
  const key=(d)=>scale==="mese"?d.slice(0,7):d.slice(0,4);
  const buckets=useMemo(()=>{
    const m={};
    mine.forEach(({t,q})=>{const k=key(t.date);m[k]=m[k]||{k,in:0,out:0};
      if(t.type==="income")m[k].in+=q;else m[k].out+=q;});
    return Object.values(m).sort((a,b)=>a.k.localeCompare(b.k));
  },[mine,scale]);
  const cur=buckets[buckets.length-1]||{k:today().slice(0,7),in:0,out:0};
  const label=(k)=>scale==="mese"?MESI[+k.slice(5,7)-1]+" "+k.slice(2,4):k;
  const recent=useMemo(()=>[...mine].sort((a,b)=>b.t.date.localeCompare(a.t.date)).slice(0,scale==="anno"?250:80),[mine,scale]);

  const [visMax,setVisMax]=useState(1);
  const recalc=()=>{const el=scroller.current;if(!el||!buckets.length)return;
    const item=el.scrollWidth/buckets.length;
    const a=Math.max(0,Math.floor(el.scrollLeft/item));
    const b=Math.min(buckets.length,Math.ceil((el.scrollLeft+el.clientWidth)/item));
    const w=buckets.slice(a,Math.max(a+1,b));
    setVisMax(Math.max(1,...w.map(x=>Math.max(x.in,x.out))));};
  useEffect(()=>{ if(scroller.current){scroller.current.scrollLeft=scroller.current.scrollWidth;}
    const id=setTimeout(recalc,60); return ()=>clearTimeout(id);},[buckets,scale]);
  const max=visMax;
  const iOwe=myBalance<-0.005;

  const settle=async()=>{
    try{ await fb.addDoc(fb.collection(fb.db,"settlements"),
      {date:today(),amount:Math.round(Math.abs(myBalance)*100)/100,from:user,to:other(user),createdAt:fb.serverTimestamp()});
      setConfirm(false); say("Conguaglio registrato");
    }catch(e){ say("Errore: "+e.code); }
  };

  return (<>
    <div style={{display:"flex",gap:6,margin:"14px 0 10px"}}>
      {["mese","anno"].map(s=>(
        <button key={s} onClick={()=>setScale(s)} style={{flex:1,padding:9,borderRadius:9,border:"1px solid "+(scale===s?T.brand:T.line),background:scale===s?T.brandSoft:T.surface,color:scale===s?T.brand:T.muted,fontWeight:700,fontSize:13}}>Per {s}</button>
      ))}
    </div>

    <Card>
      <div style={{fontSize:11.5,color:T.muted,fontWeight:700,letterSpacing:1,textTransform:"uppercase"}}>Flusso di cassa · {label(cur.k)}</div>
      <div style={{fontSize:34,fontWeight:800,letterSpacing:-1.4,margin:"6px 0 2px",color:cur.in-cur.out>=0?T.in:T.out,fontVariantNumeric:"tabular-nums"}}>{eur(cur.in-cur.out)}</div>
      <div style={{display:"flex",gap:18,fontSize:13,color:T.muted}}>
        <span>Entrate <b style={{color:T.in}}>{eur(cur.in)}</b></span>
        <span>Uscite <b style={{color:T.out}}>{eur(cur.out)}</b></span>
      </div>
      <div style={{borderTop:"1px solid "+T.line,marginTop:12,paddingTop:11}}>
        {Math.abs(myBalance)<0.005 ? <div style={{fontSize:14,color:T.muted}}>Nessun debito aperto con {USERS[other(user)]}.</div> : (
          <div style={{display:"flex",alignItems:"center",gap:10}}>
            <div style={{flex:1,fontSize:14}}>
              {iOwe?<>Devi a <b>{USERS[other(user)]}</b></>:<><b>{USERS[other(user)]}</b> ti deve</>}
              <div style={{fontSize:21,fontWeight:800,color:iOwe?T.out:T.in,fontVariantNumeric:"tabular-nums"}}>{eur(Math.abs(myBalance))}</div>
            </div>
            <Btn kind={iOwe?"primary":"ghost"} disabled={!iOwe} onClick={()=>setConfirm(true)} style={{width:"auto",padding:"10px 16px"}}>Conguaglio</Btn>
          </div>
        )}
      </div>
    </Card>

    {confirm && (
      <div style={{position:"fixed",inset:0,background:"rgba(0,0,0,.45)",display:"flex",alignItems:"center",justifyContent:"center",padding:22,zIndex:90}}>
        <Card style={{maxWidth:340}}>
          <div style={{fontSize:16,fontWeight:700,marginBottom:8}}>Conferma conguaglio</div>
          <div style={{fontSize:14.5,lineHeight:1.5,marginBottom:16}}>Hai fatto bonifico di <b>{eur(Math.abs(myBalance))}</b> a <b>{USERS[other(user)]}</b>?</div>
          <div style={{display:"flex",gap:8}}>
            <Btn kind="ghost" onClick={()=>setConfirm(false)}>No</Btn>
            <Btn onClick={settle}>Sì, conguaglia</Btn>
          </div>
        </Card>
      </div>
    )}

    <H>Andamento {scale==="mese"?"mensile":"annuale"}</H>
    <Card style={{padding:"14px 10px"}}>
      <div style={{display:"flex"}}>
        <div style={{flex:"0 0 auto",width:46,height:110,position:"relative",marginRight:4}}>
          {[1,0.5,0].map(f=><div key={f} style={{position:"absolute",right:0,top:(1-f)*110-6,fontSize:9.5,color:T.muted,fontVariantNumeric:"tabular-nums"}}>{eur0(max*f)}</div>)}
        </div>
        <div ref={scroller} onScroll={recalc} style={{overflowX:"auto",display:"flex",gap:12,alignItems:"flex-end",paddingBottom:6,flex:1,borderLeft:"1px solid "+T.line,paddingLeft:8}}>
          {buckets.map(b=>(
            <div key={b.k} style={{flex:"0 0 auto",textAlign:"center",width:44}}>
              <div style={{display:"flex",gap:3,alignItems:"flex-end",justifyContent:"center",height:110}}>
                <div style={{width:15,height:Math.max(2,Math.min(110,(b.in/max)*110)),background:T.in,borderRadius:"3px 3px 0 0"}} />
                <div style={{width:15,height:Math.max(2,Math.min(110,(b.out/max)*110)),background:T.out,borderRadius:"3px 3px 0 0"}} />
              </div>
              <div style={{fontSize:10,color:T.muted,marginTop:5,fontWeight:600}}>{label(b.k)}</div>
            </div>
          ))}
        </div>
      </div>
      <div style={{fontSize:11,color:T.muted,marginTop:4,textAlign:"center"}}>Scorri con il dito · verde entrate, rosso uscite</div>
    </Card>

    <H>Movimenti · solo la tua quota</H>
    <Card style={{padding:"4px 14px"}}>
      {recent.length===0 && <div style={{padding:"14px 0",fontSize:13.5,color:T.muted}}>Nessun movimento. Premi + per registrare il primo.</div>}
      {recent.map(({t,q},i)=>{
        const {leaf,group}=meta(t);
        const k=key(t.date), prev=i>0?key(recent[i-1].t.date):null, head=k!==prev;
        const titolo=scale==="mese"?MESILUNGHI[+k.slice(5,7)-1]+" "+k.slice(0,4):k;
        return (<React.Fragment key={t.id}>
          {head && <div style={{position:"sticky",top:0,background:T.surface,padding:"10px 0 6px",borderBottom:"2px solid "+T.brand,marginTop:i?10:0,zIndex:2}}>
            <span style={{fontSize:12.5,fontWeight:800,letterSpacing:.6,textTransform:"uppercase",color:T.brand}}>{titolo}</span></div>}
          <div onClick={()=>{setEditing(t);setView("add");}} style={{display:"flex",gap:10,alignItems:"center",padding:"10px 0",borderBottom:"1px solid "+T.line}}>
            <div style={{fontSize:20}}>{group?group.icon:"📌"}</div>
            <div style={{flex:1,minWidth:0}}>
              <div style={{fontSize:14,fontWeight:600,whiteSpace:"nowrap",overflow:"hidden",textOverflow:"ellipsis"}}>
                {leaf?leaf.name:(group?group.name:"?")}{t.note?<span style={{color:T.muted,fontWeight:400}}> · {t.note}</span>:null}</div>
              <div style={{fontSize:11.5,color:T.muted}}>
                {t.date.slice(8,10)}/{t.date.slice(5,7)} · {group?group.name:""} · {L2LABEL[group?group.l2:""]}
                {t.shared&&<span style={{color:T.brand,fontWeight:700}}> · condivisa {t.splitPercent}%</span>}
                {t.createdBy!==user&&<span> · da {USERS[t.createdBy]}</span>}
                {t.editedBy&&<span> · mod. {USERS[t.editedBy]}</span>}
              </div>
            </div>
            <div style={{fontWeight:700,fontSize:14.5,color:t.type==="income"?T.in:T.out,fontVariantNumeric:"tabular-nums"}}>{t.type==="income"?"+":"−"}{eur(q).slice(1)}</div>
          </div>
        </React.Fragment>);
      })}
    </Card>
  </>);
}

/* ---------- Inserimento / modifica ---------- */
function AddEdit({cats,user,initial,onSave,onDelete,onCancel}){
  const o=other(user);
  const [kind,setKind]=useState(initial?(initial.shared?(initial.type==="income"?"ic":"ec"):(initial.type==="income"?"i":"e")):"e");
  const [expr,setExpr]=useState(initial?String(initial.amount):"");
  const [mode,setMode]=useState(initial?.splitMode||"paid_by_me_split");
  const [pct,setPct]=useState(initial?.splitPercent||50);
  const [date,setDate]=useState(initial?.date||today());
  const [note,setNote]=useState(initial?.note||"");
  const [leafId,setLeafId]=useState(initial?.leafId||null);
  const [busy,setBusy]=useState(false);

  const shared=kind==="ec"||kind==="ic";
  const type=(kind==="i"||kind==="ic")?"income":"expense";
  const l1=type==="income"?"entrate":"spese";
  const [l2,setL2]=useState(()=>{
    if(initial){ const g=cats.groups.find(x=>x.id===initial.groupId)
        ||(initial.leafId?cats.groups.find(x=>x.id===(cats.leaves.find(y=>y.id===initial.leafId)||{}).groupId):null);
      if(g) return g.l2; return initial.type==="income"?"stipendio":"variabili"; }
    return "variabili";});
  const [gid,setGid]=useState(()=>{
    if(!initial) return null;
    if(initial.groupId&&cats.groups.some(g=>g.id===initial.groupId)) return initial.groupId;
    const lf=cats.leaves.find(x=>x.id===initial.leafId); return lf?lf.groupId:null;});
  const first=useRef(true);
  useEffect(()=>{ if(first.current){first.current=false;return;}
    if(l1==="entrate"&&(l2==="fisse"||l2==="variabili")){setL2("stipendio");setGid(null);setLeafId(null);}
    if(l1==="spese"&&(l2==="stipendio"||l2==="altre_entrate")){setL2("variabili");setGid(null);setLeafId(null);}
  },[l1]);

  const groups=cats.groups.filter(g=>g.l2===l2&&!g.archived);
  const leaves=cats.leaves.filter(l=>l.groupId===gid&&!l.archived);
  const val=calc(expr);
  const ok=!isNaN(val)&&val>0&&gid&&!busy;
  const K=({c,act})=><button onClick={act||(()=>setExpr(expr+c))} style={{flex:1,padding:"15px 0",fontSize:19,fontWeight:600,background:T.surface,border:"1px solid "+T.line,borderRadius:10}}>{c}</button>;

  return (
    <div style={{paddingTop:14}}>
      <div style={{fontSize:19,fontWeight:800,marginBottom:12}}>{initial?"Modifica movimento":"Nuovo movimento"}</div>
      <select value={kind} onChange={e=>setKind(e.target.value)} style={sel}>
        <option value="e">Spesa</option><option value="i">Entrata</option>
        <option value="ec">Spesa condivisa</option><option value="ic">Entrata condivisa</option>
      </select>

      <Card style={{margin:"10px 0"}}>
        <div style={{fontSize:12,color:T.muted,fontWeight:700}}>{type==="income"?"ENTRATA +":"USCITA −"}</div>
        <div style={{fontSize:30,fontWeight:800,fontVariantNumeric:"tabular-nums",letterSpacing:-1,color:type==="income"?T.in:T.out,minHeight:40,wordBreak:"break-all"}}>{expr||"0"}</div>
        <div style={{fontSize:13,color:isNaN(val)?T.out:T.muted}}>{expr?(isNaN(val)?"espressione non valida":"= "+eur(val)):"digita o calcola, e.g. 12.50+4"}</div>
        <div style={{display:"grid",gridTemplateColumns:"repeat(4,1fr)",gap:6,marginTop:10}}>
          {["7","8","9","("].map(c=><K key={c} c={c}/>)}
          {["4","5","6",")"].map(c=><K key={c} c={c}/>)}
          {["1","2","3","+"].map(c=><K key={c} c={c}/>)}
          {[".","0","-","*"].map(c=><K key={c} c={c}/>)}
          <K c="/"/><K c="⌫" act={()=>setExpr(expr.slice(0,-1))}/><K c="C" act={()=>setExpr("")}/>
          <K c="=" act={()=>{const v=calc(expr);if(!isNaN(v))setExpr(String(Math.round(v*100)/100));}}/>
        </div>
      </Card>

      {shared && (
        <Card style={{marginBottom:10}}>
          <div style={{fontSize:12,fontWeight:700,color:T.muted,marginBottom:6}}>CONDIVISIONE</div>
          <select value={mode} onChange={e=>setMode(e.target.value)} style={sel}>
            {["paid_by_me_split","paid_by_other_split","i_owe_full","other_owes_full"].map(m=><option key={m} value={m}>{SPLITLABEL(m,o)}</option>)}
          </select>
          {(mode==="paid_by_me_split"||mode==="paid_by_other_split") && (
            <select value={pct} onChange={e=>setPct(+e.target.value)} style={{...sel,marginTop:8}}>
              {[10,20,30,40,50,60,70,80,90].map(p=><option key={p} value={p}>La tua quota {p}% · {USERS[o]} {100-p}%</option>)}
            </select>
          )}
          {!isNaN(val)&&val>0 && (
            <div style={{fontSize:12.5,color:T.muted,marginTop:8,background:T.brandSoft,padding:9,borderRadius:8}}>
              A te {eur(shareFor({type,amount:val,shared:true,splitMode:mode,splitPercent:pct,createdBy:user},user))} · a {USERS[o]} {eur(shareFor({type,amount:val,shared:true,splitMode:mode,splitPercent:pct,createdBy:user},o))}
            </div>
          )}
        </Card>
      )}

      <Card style={{marginBottom:10}}>
        <div style={{fontSize:12,fontWeight:700,color:T.muted,marginBottom:6}}>CATEGORIA</div>
        <div style={{display:"flex",gap:6,marginBottom:8}}>
          {(l1==="spese"?["fisse","variabili"]:["stipendio","altre_entrate"]).map(k=>(
            <button key={k} onClick={()=>{setL2(k);setGid(null);setLeafId(null);}} style={{flex:1,padding:9,borderRadius:9,border:"1px solid "+(l2===k?T.brand:T.line),background:l2===k?T.brandSoft:T.surface,fontWeight:700,fontSize:13}}>{L2LABEL[k]}</button>
          ))}
        </div>
        <div style={{display:"flex",flexWrap:"wrap",gap:6,marginBottom:gid?10:0}}>
          {groups.map(g=>(
            <button key={g.id} onClick={()=>{setGid(g.id);setLeafId(null);}} style={{padding:"7px 10px",borderRadius:18,border:"1px solid "+(gid===g.id?T.brand:T.line),background:gid===g.id?T.brandSoft:T.surface,fontSize:13}}>{g.icon} {g.name}</button>
          ))}
        </div>
        {gid && (<>
          <div style={{fontSize:11,color:T.muted,marginBottom:5}}>Dettaglio (facoltativo, tocca di nuovo per togliere)</div>
          <div style={{display:"flex",flexWrap:"wrap",gap:6}}>
            {leaves.map(l=>(
              <button key={l.id} onClick={()=>setLeafId(leafId===l.id?null:l.id)} style={{padding:"7px 10px",borderRadius:8,border:"1px solid "+(leafId===l.id?T.brand:T.line),background:leafId===l.id?T.brand:T.surface,color:leafId===l.id?"#fff":T.ink,fontSize:12.5}}>{l.name}</button>
            ))}
          </div>
        </>)}
      </Card>

      <Card style={{marginBottom:12}}>
        <input type="date" value={date} onChange={e=>setDate(e.target.value)} style={sel} />
        <input placeholder="Nota (facoltativa)" value={note} onChange={e=>setNote(e.target.value)} style={{...sel,marginTop:8}} />
      </Card>

      <Btn disabled={!ok} onClick={()=>{setBusy(true);onSave({id:initial?.id,date,type,
        amount:Math.round(val*100)/100,groupId:gid,leafId:leafId||null,note,shared,
        splitMode:shared?mode:null,splitPercent:pct});}}>{initial?"Salva modifiche":"Registra movimento"}</Btn>
      {initial && <div style={{marginTop:8}}><Btn kind="danger" onClick={()=>onDelete(initial.id)}>Elimina movimento</Btn></div>}
      <div style={{marginTop:8,marginBottom:8}}><Btn kind="ghost" onClick={onCancel}>Annulla</Btn></div>
    </div>
  );
}

/* ---------- Report ---------- */
function Report({tx,user,meta,balances,fb,say}){
  const [rev,setRev]=useState(""),[fin,setFin]=useState(""),[int,setInt]=useState("");
  const mine=tx.map(t=>({t,q:shareFor(t,user)})).filter(x=>x.q>0.0001);
  const byYear=useMemo(()=>{
    const m={};
    mine.forEach(({t,q})=>{const y=t.date.slice(0,4),g=meta(t).group;if(!g)return;
      m[y]=m[y]||{y,fisse:0,variabili:0,entrate:0};
      if(t.type==="income")m[y].entrate+=q;else m[y][g.l2]+=q;});
    return Object.values(m).sort((a,b)=>a.y.localeCompare(b.y));},[tx,user]);

  const addSnapshot=async()=>{
    if(!rev&&!fin&&!int) return say("Inserisci almeno un valore");
    try{ await fb.addDoc(fb.collection(fb.db,"balances"),
      {date:today(),revolut:+rev||0,fineco:+fin||0,intesa:+int||0,createdBy:user,createdAt:fb.serverTimestamp()});
      setRev("");setFin("");setInt("");say("Rilevazione salvata");}catch(e){say("Errore: "+e.code);}
  };

  const Bars=({rows,keys,colors,labelKey})=>{
    const box=useRef(null);
    const full=Math.max(1,...rows.flatMap(r=>keys.map(k=>Math.abs(r[k]))));
    const [max,setMax]=useState(full);
    const recalc=()=>{const el=box.current;if(!el||!rows.length)return;
      const item=el.scrollWidth/rows.length;
      const a=Math.max(0,Math.floor(el.scrollLeft/item));
      const b=Math.min(rows.length,Math.ceil((el.scrollLeft+el.clientWidth)/item));
      const w=rows.slice(a,Math.max(a+1,b));
      setMax(Math.max(1,...w.flatMap(r=>keys.map(k=>Math.abs(r[k])))));};
    useEffect(()=>{const id=setTimeout(recalc,60);return ()=>clearTimeout(id);},[rows]);
    return (
      <div style={{display:"flex",padding:"8px 0"}}>
        <div style={{flex:"0 0 auto",width:48,height:100,position:"relative",marginRight:4}}>
          {[1,0.5,0].map(f=><div key={f} style={{position:"absolute",right:0,top:(1-f)*100-6,fontSize:9.5,color:T.muted,fontVariantNumeric:"tabular-nums"}}>{eur0(max*f)}</div>)}
        </div>
        <div ref={box} onScroll={recalc} style={{display:"flex",gap:14,alignItems:"flex-end",overflowX:"auto",flex:1,borderLeft:"1px solid "+T.line,paddingLeft:8}}>
          {rows.map(r=>(
            <div key={r[labelKey]} style={{flex:"0 0 auto",textAlign:"center"}}>
              <div style={{display:"flex",gap:4,alignItems:"flex-end",height:100}}>
                {keys.map((k,i)=><div key={k} style={{width:17,height:Math.max(2,Math.min(100,(Math.abs(r[k])/max)*100)),background:colors[i],borderRadius:"3px 3px 0 0",opacity:r[k]<0?0.5:1}} />)}
              </div>
              <div style={{fontSize:10.5,color:T.muted,marginTop:5,fontWeight:600}}>{r[labelKey]}</div>
            </div>
          ))}
        </div>
      </div>);
  };
  const Tab=({head,rows})=>(
    <div style={{overflowX:"auto"}}>
      <table style={{width:"100%",borderCollapse:"collapse",fontSize:12.5,fontVariantNumeric:"tabular-nums"}}>
        <thead><tr>{head.map((h,i)=><th key={i} style={{textAlign:i?"right":"left",padding:"6px 5px",borderBottom:"2px solid "+T.line,color:T.muted,fontSize:10.5,textTransform:"uppercase",whiteSpace:"nowrap"}}>{h}</th>)}</tr></thead>
        <tbody>{rows.map((r,i)=><tr key={i}>{r.map((c,j)=><td key={j} style={{textAlign:j?"right":"left",padding:"6px 5px",borderBottom:"1px solid "+T.line,color:(j%2===0&&j)?T.muted:T.ink,whiteSpace:"nowrap"}}>{c}</td>)}</tr>)}</tbody>
      </table>
    </div>);

  return (
    <div style={{paddingTop:14}}>
      <div style={{fontSize:19,fontWeight:800,marginBottom:4}}>Report · {USERS[user]}</div>
      <div style={{fontSize:12.5,color:T.muted,marginBottom:12}}>Cifre precise e, a destra di ciascuna, l'arrotondamento al centinaio più vicino.</div>

      <H>1 · Fisse, variabili ed entrate per anno</H>
      <Card>
        <Bars rows={byYear} keys={["fisse","variabili","entrate"]} colors={[T.brand,"#7FA3C7",T.in]} labelKey="y" />
        <div style={{fontSize:11,color:T.muted,marginBottom:8}}>■ fisse ■ variabili ■ entrate</div>
        <Tab head={["Anno","Fisse","~100","Variabili","~100","Entrate","~100"]}
          rows={[...byYear].reverse().map(r=>[r.y,eur(r.fisse),eur0(round100(r.fisse)),eur(r.variabili),eur0(round100(r.variabili)),eur(r.entrate),eur0(round100(r.entrate))])} />
      </Card>

      <H>2 · Patrimoni per rilevazione</H>
      <Card>
        <Bars rows={balances.map(b=>({...b,lab:b.date.slice(2,7)}))} keys={["revolut","fineco","intesa"]} colors={["#2E6BE6",T.brand,"#0E8A6A"]} labelKey="lab" />
        <div style={{fontSize:11,color:T.muted,marginBottom:8}}>■ Revolut ■ Fineco ■ Intesa</div>
        <Tab head={["Data","Revolut","~100","Fineco","~100","Intesa","~100","Totale","~100"]}
          rows={[...balances].reverse().map(b=>{const tot=b.revolut+b.fineco+b.intesa;
            return [b.date,eur(b.revolut),eur0(round100(b.revolut)),eur(b.fineco),eur0(round100(b.fineco)),eur(b.intesa),eur0(round100(b.intesa)),eur(tot),eur0(round100(tot))];})} />
        <div style={{borderTop:"1px solid "+T.line,marginTop:12,paddingTop:10}}>
          <div style={{fontSize:12,fontWeight:700,color:T.muted,marginBottom:7}}>NUOVA RILEVAZIONE · {today()}</div>
          <input placeholder="Revolut (conto deposito)" value={rev} onChange={e=>setRev(e.target.value)} inputMode="decimal" style={sel} />
          <input placeholder="Fineco (investimenti)" value={fin} onChange={e=>setFin(e.target.value)} inputMode="decimal" style={{...sel,marginTop:7}} />
          <input placeholder="Intesa Sanpaolo" value={int} onChange={e=>setInt(e.target.value)} inputMode="decimal" style={{...sel,marginTop:7}} />
          <div style={{marginTop:9}}><Btn kind="ghost" onClick={addSnapshot}>Salva rilevazione</Btn></div>
        </div>
      </Card>

      <H>3 · Differenza entrate meno uscite per anno</H>
      <Card>
        <Bars rows={byYear.map(r=>({...r,netto:r.entrate-r.fisse-r.variabili}))} keys={["netto"]} colors={[T.in]} labelKey="y" />
        <Tab head={["Anno","Entrate","~100","Uscite","~100","Netto","~100"]}
          rows={[...byYear].reverse().map(r=>{const u=r.fisse+r.variabili,n=r.entrate-u;
            return [r.y,eur(r.entrate),eur0(round100(r.entrate)),eur(u),eur0(round100(u)),eur(n),eur0(round100(n))];})} />
      </Card>

      <div style={{margin:"16px 0 4px"}}><Btn onClick={()=>{try{window.print();}catch(e){say("Stampa non disponibile");}}}>Condividi report in PDF</Btn></div>
      <div style={{fontSize:11.5,color:T.muted,lineHeight:1.5,paddingBottom:10}}>Su iPhone si apre la stampa: pizzica per ingrandire l'anteprima, poi usa Condividi per inviare il PDF via mail.</div>
    </div>
  );
}

/* ---------- Categorie ---------- */
function CatsView({cats,saveCats,tx,say}){
  const [l2,setL2]=useState("fisse");
  const [newLeaf,setNewLeaf]=useState({});
  const [newGroup,setNewGroup]=useState("");
  const [picking,setPicking]=useState(null);
  const count=(leafId)=>tx.filter(t=>t.leafId===leafId).length;
  const gcount=(gid)=>tx.filter(t=>t.groupId===gid).length;

  const rename=(kind,id,name)=>{
    if(!name||!name.trim()) return;
    saveCats(kind==="g"
      ?{...cats,groups:cats.groups.map(g=>g.id===id?{...g,name:name.trim()}:g)}
      :{...cats,leaves:cats.leaves.map(l=>l.id===id?{...l,name:name.trim()}:l)});
    say("Rinominata, lo storico si aggiorna da solo");
  };
  const addLeaf=(gid)=>{const n=(newLeaf[gid]||"").trim();if(!n)return;
    saveCats({...cats,leaves:[...cats.leaves,{id:gid+"."+slug(n)+"_"+Date.now(),groupId:gid,name:n,archived:false}]});
    setNewLeaf({...newLeaf,[gid]:""});say("Voce aggiunta");};
  const addGroup=()=>{const n=newGroup.trim();if(!n)return;
    const l1=(l2==="fisse"||l2==="variabili")?"spese":"entrate";
    saveCats({...cats,groups:[...cats.groups,{id:l2+"."+slug(n)+"_"+Date.now(),l1,l2,name:n,icon:autoEmoji(n),archived:false}]});
    setNewGroup("");say("Gruppo aggiunto con emoji "+autoEmoji(n));};
  const removeLeaf=(l)=>{
    if(count(l.id)>0){ saveCats({...cats,leaves:cats.leaves.map(x=>x.id===l.id?{...x,archived:!x.archived}:x)});
      say(l.archived?"Voce riattivata":"Archiviata: ha "+count(l.id)+" movimenti collegati"); }
    else { saveCats({...cats,leaves:cats.leaves.filter(x=>x.id!==l.id)}); say("Voce eliminata"); }};
  const removeGroup=(g)=>{
    const n=gcount(g.id);
    if(n>0){ saveCats({...cats,groups:cats.groups.map(x=>x.id===g.id?{...x,archived:!x.archived}:x)});
      say(g.archived?"Gruppo riattivato":"Archiviato: ha "+n+" movimenti"); }
    else { saveCats({...cats,groups:cats.groups.filter(x=>x.id!==g.id),leaves:cats.leaves.filter(x=>x.groupId!==g.id)}); say("Gruppo eliminato"); }};

  return (
    <div style={{paddingTop:14}}>
      <div style={{fontSize:19,fontWeight:800,marginBottom:4}}>Categorie</div>
      <div style={{fontSize:12.5,color:T.muted,marginBottom:12}}>Livelli 1 e 2 fissi. Gruppi e voci si aggiungono e rinominano; la rinomina è retroattiva su tutto lo storico.</div>
      <div style={{display:"flex",gap:5,marginBottom:12,flexWrap:"wrap"}}>
        {Object.keys(TREE).map(k=>(
          <button key={k} onClick={()=>setL2(k)} style={{padding:"7px 11px",borderRadius:18,border:"1px solid "+(l2===k?T.brand:T.line),background:l2===k?T.brandSoft:T.surface,fontSize:12.5,fontWeight:600}}>{L2LABEL[k]}</button>
        ))}
      </div>
      {cats.groups.filter(g=>g.l2===l2).map(g=>(
        <Card key={g.id} style={{marginBottom:9,opacity:g.archived?0.5:1}}>
          <div style={{display:"flex",alignItems:"center",gap:8}}>
            <button onClick={()=>setPicking(picking===g.id?null:g.id)} style={{fontSize:19,background:picking===g.id?T.brandSoft:"none",border:"1px solid "+(picking===g.id?T.brand:T.line),borderRadius:8,padding:"3px 7px"}}>{g.icon}</button>
            <input defaultValue={g.name} onBlur={e=>e.target.value!==g.name&&rename("g",g.id,e.target.value)} style={{flex:1,border:"none",fontSize:15,fontWeight:700,background:"none",color:T.ink,minWidth:0}} />
            <button onClick={()=>removeGroup(g)} style={{background:"none",border:"1px solid "+T.line,borderRadius:7,fontSize:11,padding:"3px 7px",color:T.muted}}>{gcount(g.id)>0?(g.archived?"riattiva":"archivia"):"elimina"}</button>
          </div>
          {picking===g.id && (
            <div style={{display:"flex",flexWrap:"wrap",gap:4,marginTop:8,padding:8,background:T.bg,borderRadius:9,maxHeight:150,overflowY:"auto"}}>
              {PALETTE.map((e,i)=><button key={i} onClick={()=>{saveCats({...cats,groups:cats.groups.map(x=>x.id===g.id?{...x,icon:e}:x)});setPicking(null);say("Emoji aggiornata");}} style={{fontSize:18,background:"none",border:"none",padding:2}}>{e}</button>)}
            </div>
          )}
          <div style={{marginTop:8}}>
            {cats.leaves.filter(l=>l.groupId===g.id).map(l=>(
              <div key={l.id} style={{display:"flex",alignItems:"center",gap:6,padding:"5px 0",borderTop:"1px solid "+T.line,opacity:l.archived?0.45:1}}>
                <input defaultValue={l.name} onBlur={e=>e.target.value!==l.name&&rename("l",l.id,e.target.value)} style={{flex:1,border:"none",fontSize:13.5,background:"none",color:T.ink,minWidth:0}} />
                <span style={{fontSize:11,color:T.muted}}>{count(l.id)}</span>
                <button onClick={()=>removeLeaf(l)} style={{background:"none",border:"1px solid "+T.line,borderRadius:7,fontSize:11,padding:"3px 7px",color:T.muted}}>{count(l.id)>0?(l.archived?"riattiva":"archivia"):"elimina"}</button>
              </div>
            ))}
            <div style={{display:"flex",gap:6,marginTop:7}}>
              <input placeholder="Nuova voce…" value={newLeaf[g.id]||""} onChange={e=>setNewLeaf({...newLeaf,[g.id]:e.target.value})} style={{...sel,padding:"7px 9px",fontSize:14}} />
              <button onClick={()=>addLeaf(g.id)} style={{background:T.brandSoft,border:"1px solid "+T.brand,color:T.brand,borderRadius:9,padding:"0 13px",fontWeight:700}}>+</button>
            </div>
          </div>
        </Card>
      ))}
      <Card style={{marginBottom:10}}>
        <div style={{fontSize:12,fontWeight:700,color:T.muted,marginBottom:7}}>NUOVO GRUPPO IN {L2LABEL[l2].toUpperCase()}</div>
        <div style={{display:"flex",gap:6}}>
          <input placeholder="Nome gruppo…" value={newGroup} onChange={e=>setNewGroup(e.target.value)} style={{...sel,padding:"8px 10px",fontSize:14}} />
          <button onClick={addGroup} style={{background:T.brandSoft,border:"1px solid "+T.brand,color:T.brand,borderRadius:9,padding:"0 14px",fontWeight:700}}>+</button>
        </div>
      </Card>
    </div>
  );
}

/* ---------- Dati ---------- */
const CSVHEAD=["Data","Tipo","Importo","Livello2","Gruppo","Voce","Nota","Split","Quota%","InseritoDa"];

function DataView({tx,cats,meta,user,fb,doBackup,config,setSimLock,say}){
  const [imp,setImp]=useState(null);
  const [busy,setBusy]=useState(false);

  const exportCSV=(all)=>{
    const rows=(all?tx:tx.filter(t=>shareFor(t,user)>0)).map(t=>{
      const {leaf,group}=meta(t);
      return [t.date,t.type==="income"?"Entrata":"Spesa",t.amount.toFixed(2),
        group?group.l2:"",group?group.name:"",leaf?leaf.name:"",t.note||"",
        t.shared?t.splitMode:"",t.shared?t.splitPercent:"",t.createdBy];
    });
    const csv="\uFEFF"+[CSVHEAD,...rows].map(r=>r.map(c=>'"'+String(c??"").replace(/"/g,'""')+'"').join(";")).join("\n");
    const how=shareOrDownload(new Blob([csv],{type:"text/csv"}),
      "SPENDOMETRO_"+(all?"completo":"mio")+"_"+today()+".csv","Export Spendometro");
    say(how==="fallback"?"Export non riuscito qui, riprova dal telefono":"CSV generato");
  };

  const parseCSV=(text)=>{
    const rows=[];let cur=[],f="",q=false;
    text=text.replace(/^\uFEFF/,"");
    for(let i=0;i<text.length;i++){const c=text[i];
      if(q){ if(c==='"'&&text[i+1]==='"'){f+='"';i++;} else if(c==='"'){q=false;} else f+=c; }
      else { if(c==='"')q=true; else if(c===";"||c===","){cur.push(f);f="";}
        else if(c==="\n"){cur.push(f);rows.push(cur);cur=[];f="";}
        else if(c!=="\r") f+=c; } }
    if(f||cur.length){cur.push(f);rows.push(cur);}
    return rows.filter(r=>r.some(x=>x!==""));
  };

  const onFile=(e)=>{
    const file=e.target.files[0]; if(!file) return;
    const r=new FileReader();
    r.onload=()=>{ try{
      const rows=parseCSV(String(r.result));
      const head=rows[0].map(h=>h.trim());
      const idx=Object.fromEntries(CSVHEAD.map(h=>[h,head.findIndex(x=>x.toLowerCase()===h.toLowerCase())]));
      if(idx.Data<0||idx.Importo<0) return say("Intestazione non riconosciuta. Usa un CSV esportato da Spendometro.");
      const recs=rows.slice(1).map(r=>({
        date:(r[idx.Data]||"").slice(0,10),
        type:(r[idx.Tipo]||"").toLowerCase().startsWith("e")&&(r[idx.Tipo]||"").toLowerCase()!=="entrata"?"expense":((r[idx.Tipo]||"").toLowerCase()==="entrata"?"income":"expense"),
        amount:Math.abs(parseFloat(String(r[idx.Importo]).replace(",","."))||0),
        l2:(r[idx.Livello2]||"variabili").trim(),
        gname:(r[idx.Gruppo]||"Altro").trim(),
        lname:(r[idx.Voce]||"").trim(),
        note:(r[idx.Nota]||"").trim(),
        splitMode:(r[idx.Split]||"").trim()||null,
        splitPercent:parseInt(r[idx["Quota%"]])||50,
        createdBy:(r[idx.InseritoDa]||user).trim(),
      })).filter(x=>x.date&&x.amount>0);
      setImp({name:file.name,recs});
      say("Letto "+file.name+": "+recs.length+" righe pronte");
    }catch(err){ say("File non leggibile"); } };
    r.readAsText(file);
  };

  const doImport=async()=>{
    if(!imp) return; setBusy(true);
    let cs={groups:[...cats.groups],leaves:[...cats.leaves]};
    const findG=(l2,name)=>cs.groups.find(g=>g.l2===l2&&g.name.toLowerCase()===name.toLowerCase());
    const findL=(gid,name)=>cs.leaves.find(l=>l.groupId===gid&&l.name.toLowerCase()===name.toLowerCase());
    const docs=[];
    for(const r of imp.recs){
      const l2=["fisse","variabili","stipendio","altre_entrate"].includes(r.l2)?r.l2:(r.type==="income"?"altre_entrate":"variabili");
      let g=findG(l2,r.gname);
      if(!g){ g={id:l2+"."+slug(r.gname)+"_"+Date.now()+Math.random().toString(36).slice(2,6),
        l1:(l2==="fisse"||l2==="variabili")?"spese":"entrate",l2,name:r.gname,icon:autoEmoji(r.gname),archived:false};
        cs.groups.push(g); }
      let lf=null;
      if(r.lname){ lf=findL(g.id,r.lname);
        if(!lf){ lf={id:g.id+"."+slug(r.lname)+"_"+Date.now()+Math.random().toString(36).slice(2,6),groupId:g.id,name:r.lname,archived:false};
          cs.leaves.push(lf); } }
      docs.push({date:r.date,type:r.type,amount:r.amount,groupId:g.id,leafId:lf?lf.id:null,
        note:r.note,shared:!!r.splitMode,splitMode:r.splitMode,splitPercent:r.splitPercent,
        createdBy:UIDS[r.createdBy]?r.createdBy:(USERS[r.createdBy]?r.createdBy:user),
        editedBy:null,source:"import"});
    }
    try{
      await fb.setDoc(fb.doc(fb.db,"meta","categories"),cs);
      for(let i=0;i<docs.length;i+=400){
        const batch=fb.writeBatch(fb.db);
        docs.slice(i,i+400).forEach(d=>batch.set(fb.doc(fb.collection(fb.db,"transactions")),d));
        await batch.commit();
      }
      say("Importati "+docs.length+" movimenti"); setImp(null);
    }catch(e){ say("Errore import: "+e.code); }
    setBusy(false);
  };

  return (
    <div style={{paddingTop:14}}>
      <div style={{fontSize:19,fontWeight:800,marginBottom:12}}>Dati e backup</div>
      <Card>
        <Row l="Movimenti in archivio" r={tx.length} />
        <Row l="Ultimo backup" r={config.lastBackup||"mai"} />
        <div style={{padding:"7px 0"}}>
          <div style={{fontSize:12,color:T.muted,fontWeight:700,marginBottom:5}}>DESTINATARIO BACKUP</div>
          <div style={{display:"flex",gap:6}}>
            <input placeholder="tua@email.com" defaultValue={config.backupEmail} inputMode="email"
              onBlur={async(e)=>{const v=e.target.value.trim();
                if(v!==config.backupEmail){ try{ await fb.updateDoc(fb.doc(fb.db,"meta","config"),{backupEmail:v}); say("Indirizzo salvato"); }catch(err){ say("Errore: "+err.code); } }}}
              style={{...sel,padding:"9px 10px",fontSize:14}} />
          </div>
          <div style={{fontSize:11,color:T.muted,marginTop:5}}>Salvato su Firestore, non nel codice pubblico.</div>
        </div>
        <div style={{marginTop:10}}><Btn onClick={doBackup}>Backup database</Btn></div>
        <div style={{fontSize:11.5,color:T.muted,marginTop:8,lineHeight:1.5}}>Genera il JSON completo e apre la condivisione. Scegli Mail e invialo a te stesso.</div>
      </Card>
      <H>Export</H>
      <Card>
        <div style={{display:"flex",flexDirection:"column",gap:8}}>
          <Btn kind="ghost" onClick={()=>exportCSV(true)}>Esporta tutto in CSV</Btn>
          <Btn kind="ghost" onClick={()=>exportCSV(false)}>Esporta solo la tua quota</Btn>
        </div>
      </Card>
      <H>Import CSV</H>
      <Card>
        <input type="file" accept=".csv,text/csv" onChange={onFile} style={{fontSize:13}} />
        {imp && (<div style={{marginTop:10}}>
          <div style={{fontSize:12.5,color:T.muted,marginBottom:8}}>{imp.name} · {imp.recs.length} righe. Le categorie mancanti vengono create in automatico.</div>
          <Btn onClick={doImport} disabled={busy}>{busy?"Importo…":"Importa "+imp.recs.length+" movimenti"}</Btn>
        </div>)}
        <div style={{fontSize:11.5,color:T.muted,marginTop:8,lineHeight:1.5}}>Formato atteso: quello dell'export di Spendometro (punto e virgola).</div>
      </Card>
      <H>Manutenzione</H>
      <Card style={{marginBottom:10}}>
        <Btn kind="ghost" onClick={()=>{setSimLock(true);say("Blocco attivato");}} disabled={user!=="pierangelo"}>Prova il blocco backup</Btn>
      </Card>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>
