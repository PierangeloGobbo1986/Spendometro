  #barra{position:fixed;bottom:0;left:0;right:0;z-index:60;transform:translateZ(0);

/* ---------- spese condivise con terzi: calcolo saldi da un registro a parte (collection "condivisioni") ---------- */
// saldo di "viewer" con "nome" (interno o esterno), sommando tutte le spese dove erano insieme.
// positivo = nome deve a viewer; negativo = viewer deve a nome.
function saldoConPersona(condivisioni,viewer,nome,settlements){
  let s=0;
  (condivisioni||[]).forEach(c=>{
    const p=c.participants||[];
    if(!p.includes(viewer)||!p.includes(nome)||viewer===nome) return;
    if(c.payer===viewer) s+=c.perShare;
    else if(c.payer===nome) s-=c.perShare;
    // se ha pagato una terza persona diversa da entrambi, questa spesa non tocca il loro saldo reciproco
  });
  (settlements||[]).forEach(st=>{
    if(st.from===nome && st.to===viewer) s-=st.amount;
    else if(st.from===viewer && st.to===nome) s+=st.amount;
  });
  return s;
}
// riepilogo completo per un'etichetta (es. un viaggio): chi deve cosa a chi, nettato a coppie.
function riepilogoEtichetta(condivisioni,etichetta){
  const et=(etichetta||"").trim().toLowerCase();
  const docs=(condivisioni||[]).filter(c=>(c.etichetta||"").trim().toLowerCase()===et);
  const saldi={};
  docs.forEach(c=>{
    (c.participants||[]).forEach(p=>{
      if(p!==c.payer) saldi[p+"→"+c.payer]=(saldi[p+"→"+c.payer]||0)+c.perShare;
    });
  });
  const nomi=[...new Set(docs.flatMap(c=>c.participants||[]))];
  const risultati=[];
  for(let i=0;i<nomi.length;i++) for(let j=i+1;j<nomi.length;j++){
    const a=nomi[i],b=nomi[j];
    const net=(saldi[a+"→"+b]||0)-(saldi[b+"→"+a]||0);
    if(Math.abs(net)>0.005) risultati.push(net>0?{da:a,a:b,importo:net}:{da:b,a:a,importo:-net});
  }
  return {docs,risultati};
}

/* ---------- split ---------- */
function shareFor(t,user){
  if(!t.shared) return t.createdBy===user?t.amount:0;
  const isC=user===t.createdBy,p=(t.splitPercent||50)/100;
  switch(t.splitMode){
    case "paid_by_me_split": case "paid_by_other_split": return t.amount*(isC?p:1-p);
    case "i_owe_full": return isC?t.amount:0;
    case "other_owes_full": return isC?0:t.amount;
    default: return 0;
  }
}
function deltaFor(t){
  if(!t.shared) return 0;
  const p=(t.splitPercent||50)/100,sign=t.type==="expense"?1:-1;
  switch(t.splitMode){
    case "paid_by_me_split": return sign*t.amount*(1-p);
    case "paid_by_other_split": return -sign*t.amount*p;
    case "i_owe_full": return -sign*t.amount;
    case "other_owes_full": return sign*t.amount;
    default: return 0;
  }
}

// converte un testo digitato dall'utente in un numero, accettando sia la virgola sia il punto
const numDec=(v)=>{ const n=parseFloat(String(v||"").trim().replace(",",".")); return isNaN(n)?0:n; };

/* ---------- aritmetica sulle date (stringhe YYYY-MM-DD), per le spese ricorrenti ---------- */
const WEEKDAYS=["Domenica","Lunedì","Martedì","Mercoledì","Giovedì","Venerdì","Sabato"];
const ymdParts=(s)=>{ const [y,m,d]=s.split("-").map(Number); return {y,m,d}; };
const daysInMonth=(y,m)=>new Date(y,m,0).getDate();   // m = mese 1-based
const addDaysStr=(s,n)=>{ const {y,m,d}=ymdParts(s); const dt=new Date(Date.UTC(y,m-1,d));
  dt.setUTCDate(dt.getUTCDate()+n); return dt.toISOString().slice(0,10); };
const addMonthsStr=(s,n)=>{ const {y,m,d}=ymdParts(s); const tot=(m-1)+n;
  const ny=y+Math.floor(tot/12), nm=((tot%12)+12)%12+1, nd=Math.min(d,daysInMonth(ny,nm));
  return ny+"-"+String(nm).padStart(2,"0")+"-"+String(nd).padStart(2,"0"); };
const prossimaOccorrenza=(s,cad)=> cad==="weekly"?addDaysStr(s,7): cad==="yearly"?addMonthsStr(s,12): addMonthsStr(s,1);
const cadenzaTesto=(rule)=>{
  const {y,m,d}=ymdParts(rule.startDate);
  if(rule.cadence==="weekly"){ const wd=new Date(rule.startDate+"T00:00:00").getDay(); return "Ogni "+WEEKDAYS[wd].toLowerCase(); }
  if(rule.cadence==="yearly") return "Ogni anno, il "+d+" "+MESILUNGHI[m-1].toLowerCase();
  return "Ogni mese, il "+d;
};

const escHtml=(s)=>String(s??"").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");

function buildPrintHTML({userName,scale,byPeriod,balances,contiVis,analysis}){
  const periodHead = scale==="mese"?"Mese":"Anno";
  const longLabP=(k)=> scale==="mese"? MESILUNGHI[+k.slice(5,7)-1]+" "+k.slice(0,4) : k;

  const tbl=(head,rows)=>"<table><thead><tr>"+head.map(h=>"<th>"+escHtml(h)+"</th>").join("")+"</tr></thead>"+
    "<tbody>"+rows.map(r=>"<tr>"+r.map(c=>"<td>"+c+"</td>").join("")+"</tr>").join("")+"</tbody></table>";

  // legenda con quadratino colorato coerente con le barre (prima usciva tutta grigia: mancava il colore per-voce)
  const legend=(items)=>"<div class=\"legend\">"+items.map(([label,color])=>
    "<span style=\"color:"+color+"\">■</span>"+escHtml(label)).join("&nbsp;&nbsp;")+"</div>";

  // istogramma in puro HTML/CSS con asse Y, niente canvas ne' SVG: la stampa resta rapida
  const chart=(rows,keys,colors,labelFn)=>{
    const full=Math.max(1,...rows.flatMap(r=>keys.map(k=>Math.abs(r[k]||0))));
    const bars=rows.map(r=>{
      const b=keys.map((k,i)=>{
        const v=r[k]||0; const h=Math.max(2,Math.round(Math.abs(v)/full*80));
        const col=typeof colors==="function"?colors(r,i):colors[i];
        return "<div class=\"bar\" style=\"height:"+h+"px;background:"+col+"\"></div>";
      }).join("");
      return "<div class=\"barcol\"><div class=\"barwrap\">"+b+"</div><div class=\"barlbl\">"+escHtml(labelFn(r))+"</div></div>";
    }).join("");
    const yax="<div class=\"yaxis\"><span style=\"top:-3px\">"+eur0(full)+"</span><span style=\"top:34px\">"+eur0(full/2)+"</span><span style=\"bottom:-3px\">€0</span></div>";
    return "<div class=\"chartrow\">"+yax+"<div class=\"chart\">"+bars+"</div></div>";
  };

  const t1rows=[...byPeriod].reverse().map(r=>[escHtml(longLabP(r.k)),eur(r.fisse),eur0(round100(r.fisse)),eur(r.variabili),eur0(round100(r.variabili)),eur(r.entrate),eur0(round100(r.entrate))]);
  const t3src=byPeriod.map(r=>({...r,netto:r.entrate-r.fisse-r.variabili}));
  const t3rows=[...t3src].reverse().map(r=>[escHtml(longLabP(r.k)),eur(r.entrate),eur0(round100(r.entrate)),eur(r.fisse+r.variabili),eur0(round100(r.fisse+r.variabili)),eur(r.netto),eur0(round100(r.netto))]);

  const contiKeys=["revolut","fineco","intesa"].filter(k=>contiVis[k]);
  const contiLabels={revolut:"Revolut",fineco:"Fineco",intesa:"Intesa"};
  const contiColors={revolut:"#2E6BE6",fineco:"#1F3A5F",intesa:"#0E8A6A"};
  const balHead=["Data",...contiKeys.flatMap(k=>[contiLabels[k],"~100"]),"Totale","~100"];
  const balRows=[...balances].reverse().map(b=>{
    const tot=contiKeys.reduce((s,k)=>s+(b[k]||0),0);
    const cells=contiKeys.flatMap(k=>[eur(b[k]||0),eur0(round100(b[k]||0))]);
    return [escHtml(b.date),...cells,eur(tot),eur0(round100(tot))];
  });

  // limite di sicurezza sull'elenco dettagliato dei movimenti: e' la tabella che puo' crescere
  // di piu' (centinaia di righe) e che pesa di piu' sui tempi di impaginazione della stampa.
  // I totali per periodo restano SEMPRE completi, qui si limita solo il dettaglio riga per riga.
  const LIMITE_MOVIMENTI=150;

  let analysisHtml="";
  if(analysis && analysis.active && analysis.serie.length){
    const palette=["#1F3A5F","#7A5AA8","#B8860B","#0E8A6A","#C0432C"];
    const rows=[...analysis.rows].reverse().map(r=>[escHtml(longLabP(r.k)),...analysis.serie.map(s=>eur(r[s.id]||0))]);
    const totRow=["<b>Totale</b>",...analysis.serie.map(s=>"<b>"+eur(analysis.totali[s.id]||0)+"</b>")];
    const tuttiMov=[...analysis.movimenti].sort((a,b)=>b.t.date.localeCompare(a.t.date));
    const movRows=tuttiMov.slice(0,LIMITE_MOVIMENTI).map(m=>[
      escHtml(m.t.date.split("-").reverse().join("/")), escHtml(m.cats.join(", ")), escHtml(m.t.etichetta||""), escHtml(m.t.note||""), eur(m.q)
    ]);
    const troncato = tuttiMov.length>LIMITE_MOVIMENTI;
    analysisHtml =
      "<h2>4 · Analisi per categoria</h2>"+
      legend(analysis.serie.map((s,i)=>[s.name,palette[i]]))+
      chart(analysis.rows,analysis.serie.map(s=>s.id),analysis.serie.map((_,i)=>palette[i]),r=>longLabP(r.k))+
      tbl([periodHead,...analysis.serie.map(s=>s.name)], [...rows,totRow])+
      "<h3>Movimenti (" + tuttiMov.length + (troncato? ", i piu' recenti "+LIMITE_MOVIMENTI:"") + ")</h3>"+
      tbl(["Data","Categoria","Etichetta","Nota","Importo"], movRows)+
      (troncato? "<div class=\"sub\">Altri "+(tuttiMov.length-LIMITE_MOVIMENTI)+" movimenti non mostrati qui: consultabili nell'app, i totali sopra li includono comunque tutti.</div>":"");
  }

  return "<h1>Spendometro</h1>"+
    "<div class=\"sub\">Report di "+escHtml(userName)+" · generato il "+new Date().toLocaleString("it-IT")+"</div>"+
    "<h2>1 · Fisse, variabili ed entrate per "+(scale==="mese"?"mese":"anno")+"</h2>"+
    legend([["Fisse","#1F3A5F"],["Variabili","#7FA3C7"],["Entrate","#127A57"]])+
    chart(byPeriod,["fisse","variabili","entrate"],["#1F3A5F","#7FA3C7","#127A57"],r=>longLabP(r.k))+
    tbl([periodHead,"Fisse","~100","Variabili","~100","Entrate","~100"], t1rows)+
    "<h2>2 · Patrimoni per rilevazione</h2>"+
    (contiKeys.length? (
      legend(contiKeys.map(k=>[contiLabels[k],contiColors[k]]))+
      chart(balances.map(b=>({...b,lab:b.date.slice(2,7)})),contiKeys,contiKeys.map(k=>contiColors[k]),r=>r.lab)
    ):"")+
    tbl(balHead, balRows)+
    "<h2>3 · Differenza entrate meno uscite per "+(scale==="mese"?"mese":"anno")+"</h2>"+
    legend([["In attivo","#127A57"],["In passivo","#C0432C"]])+
    chart(t3src,["netto"],(r)=>r.netto<0?"#C0432C":"#127A57",r=>longLabP(r.k))+
    tbl([periodHead,"Entrate","~100","Uscite","~100","Netto","~100"], t3rows)+
    analysisHtml;
}

function calc(expr){
  const tk=String(expr).replace(/,/g,".").match(/(\d+\.?\d*|[+\-*/()])/g);
  if(!tk) return NaN;
  let i=0; const peek=()=>tk[i],eat=()=>tk[i++];
  function E(){let v=Tm();while(peek()==="+"||peek()==="-"){const o=eat(),r=Tm();v=o==="+"?v+r:v-r;}return v;}
  function Tm(){let v=F();while(peek()==="*"||peek()==="/"){const o=eat(),r=F();v=o==="*"?v*r:v/r;}return v;}
  function F(){ if(peek()==="("){eat();const v=E();if(peek()===")")eat();return v;}
    if(peek()==="-"){eat();return -F();}
    const n=parseFloat(eat());return isNaN(n)?0:n;}
  const r=E(); return i<tk.length?NaN:r;
}

  useEffect(()=>{
    const onDoc=(e)=>{ if(wrapRef.current && !wrapRef.current.contains(e.target)) setOpen(false); };
    document.addEventListener("mousedown",onDoc); document.addEventListener("touchstart",onDoc);
    return ()=>{ document.removeEventListener("mousedown",onDoc); document.removeEventListener("touchstart",onDoc); };
  },[]);
  const filtrate=(options||[]).filter(o=>!value || o.toLowerCase().includes(value.toLowerCase()));

/* ---------- condivisione file ---------- */
function scaricaFile(blob,filename){
  try{
    const a=document.createElement("a");
    a.href=URL.createObjectURL(blob); a.download=filename;
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(()=>URL.revokeObjectURL(a.href),4000);
    return true;
  }catch(e){ return false; }
}
function shareOrDownload(blob,filename,title,onFallback){
  let file=null;
  try{ file=new File([blob],filename,{type:blob.type}); }catch(e){}
  const puoCondividere = file && navigator.canShare && navigator.canShare({files:[file]}) && navigator.share;
  if(puoCondividere){
    navigator.share({files:[file],title,text:title}).catch((err)=>{
      // annullato dall'utente: non si riprova. Qualsiasi altro errore: si scarica.
      if(err && err.name==="AbortError") return;
      if(!scaricaFile(blob,filename) && onFallback) blob.text().then(onFallback).catch(()=>{});
    });
    return "share";
  }
  if(scaricaFile(blob,filename)) return "download";
  if(onFallback) blob.text().then(onFallback).catch(()=>{});
  return "fallback";
}

  };

  const say=(m)=>{setToast(m);setTimeout(()=>setToast(null),2800);};
  const [erroreGlobale,setErroreGlobale]=useState(null);
  useEffect(()=>{
    const onErr=(e)=>{ const msg=String((e.error&&e.error.message)||e.message||e);
      if(/firestore|assertion/i.test(msg)) setErroreGlobale(msg); };
    const onRej=(e)=>{ const msg=String((e.reason&&e.reason.message)||e.reason||"");
      if(/firestore|assertion/i.test(msg)) setErroreGlobale(msg); };
    window.addEventListener("error",onErr);
    window.addEventListener("unhandledrejection",onRej);

  },[]);

  useEffect(()=>{ window.fbReady.then(setFb).catch(e=>setFbErr(e)); },[]);

  },[fb]);

  const user = authUser ? UIDS[authUser.uid] : null;

  // sottoscrizioni realtime
  const unsubTxRef=useRef(null);
  const attachTx=()=>{
    if(!fb||!user) return;
    if(unsubTxRef.current) return;      // gia' collegata
    unsubTxRef.current=fb.onSnapshot(fb.collection(fb.db,"transactions"),(s)=>{
      setTx(s.docs.map(d=>({id:d.id,pending:d.metadata.hasPendingWrites,...d.data()})));setReady(true);});
  };
  const detachTx=()=>{ if(unsubTxRef.current){ unsubTxRef.current(); unsubTxRef.current=null; } };

  useEffect(()=>{
    if(!fb||!user) return;
    const db=fb.db;
    const un=[];
    attachTx();
    un.push(fb.onSnapshot(fb.collection(db,"settlements"),(s)=>
      setSettlements(s.docs.map(d=>({id:d.id,...d.data()})))));
    un.push(fb.onSnapshot(fb.collection(db,"balances"),(s)=>
      setBalances(s.docs.map(d=>({id:d.id,...d.data()})).sort((a,b)=>a.date.localeCompare(b.date)))));
    un.push(fb.onSnapshot(fb.collection(db,"recurring"),(s)=>
      setRecurring(s.docs.map(d=>({id:d.id,...d.data()})))));
    un.push(fb.onSnapshot(fb.collection(db,"esterni"),(s)=>
      setEsterni(s.docs.map(d=>({id:d.id,...d.data()})).sort((a,b)=>a.name.localeCompare(b.name)))));
    un.push(fb.onSnapshot(fb.collection(db,"condivisioni"),(s)=>
      setCondivisioni(s.docs.map(d=>({id:d.id,...d.data()})))));
    un.push(fb.onSnapshot(fb.doc(db,"meta","categories"),async(d)=>{
      if(d.exists()){ const c=d.data(); setCats({groups:c.groups||[],leaves:c.leaves||[],subs:c.subs||[]}); }
      else { const c=buildCats(); setCats(c); fb.setDoc(fb.doc(db,"meta","categories"),c).catch(()=>{}); }
    }));
    un.push(fb.onSnapshot(fb.doc(db,"meta","photo"),(d)=>{
      setPhoto(d.exists()?(d.data().dataUrl||null):null);}));
    un.push(fb.onSnapshot(fb.doc(db,"meta","config"),async(d)=>{
      if(d.exists()) setConfig(d.data());
      else { const c={backupEmail:BACKUP_EMAIL_DEFAULT,lastBackup:"",lastBackupBy:""};
        setConfig(c); fb.setDoc(fb.doc(db,"meta","config"),c).catch(()=>{}); }
    }));
    return ()=>{ detachTx(); un.forEach(f=>f&&f()); };
  },[fb,user]);

  const leafById=useMemo(()=>cats?Object.fromEntries(cats.leaves.map(l=>[l.id,l])):{},[cats]);
  const groupById=useMemo(()=>cats?Object.fromEntries(cats.groups.map(g=>[g.id,g])):{},[cats]);
  const subById=useMemo(()=>cats&&cats.subs?Object.fromEntries(cats.subs.map(x=>[x.id,x])):{},[cats]);
  const meta=(t)=>{const lf=t.leafId?leafById[t.leafId]:null;
    const g=groupById[t.groupId]||(lf&&groupById[lf.groupId]);
    const sb=t.subId?subById[t.subId]:null;
    return {leaf:lf,group:g,sub:sb};};

  const balance=useMemo(()=>{
    let b=0;
    tx.forEach(t=>{const d=deltaFor(t); b+= t.createdBy==="pierangelo"?d:-d;});
    // spese con terzi dove partecipate entrambi: se paga uno dei due, l'altro gli deve la propria quota.
    // se paga un terzo, questa riga non tocca il vostro saldo reciproco (ve la vedete ciascuno col terzo).
    // i conguagli gia' fatti (fra voi due) sono contabilizzati dalla stessa funzione qui sotto.
    b += saldoConPersona(condivisioni,"pierangelo","martina",settlements);
    return b;
  },[tx,settlements,condivisioni]);
  const myBalance = user==="pierangelo" ? balance : -balance;
  const etichette=useMemo(()=>[...new Set(tx.map(t=>(t.etichetta||"").trim()).filter(Boolean))].sort(),[tx]);

  const mesecorrente=today().slice(0,8)+"01";
  const locked = user==="pierangelo" && config &&
    (simLock || !config.lastBackup || config.lastBackup < mesecorrente);

  /* --- scritture --- */
  // Offline le promesse di Firestore non si risolvono finche non risponde il server:
  // si naviga subito, il dato e gia nella cache locale.
  const saveTx=(t)=>{
    const db=fb.db;
    try{
      if(t.id){ const {id,pending,...rest}=t;
        const prev=tx.find(x=>x.id===id)||{};
        fb.updateDoc(fb.doc(db,"transactions",id),
          {...rest, editedBy: prev.createdBy!==user?user:(prev.editedBy||null), editedAt:fb.serverTimestamp()})
          .catch(e=>say("Sincronizzazione non riuscita: "+(e.code||e.message)));
        // torna alla schermata Spese gia' aperta sul mese/anno di questa riga, con la riga evidenziata
        setHomeSelKey(homeScale==="anno" ? t.date.slice(0,4) : t.date.slice(0,7));
        setHomeFocusId(id);
        say("Movimento aggiornato");
      } else {
        const {id,pending,...rest}=t;
        fb.addDoc(fb.collection(db,"transactions"),
          {...rest,createdBy:user,editedBy:null,source:"manual",createdAt:fb.serverTimestamp()})
          .catch(e=>say("Sincronizzazione non riuscita: "+(e.code||e.message)));
        say("Movimento registrato");
      }
      setEditing(null);setView("home");
    }catch(e){say("Errore nel salvataggio: "+(e.code||e.message));}
  };
  const delTx=(id)=>{
    try{ fb.deleteDoc(fb.doc(fb.db,"transactions",id))
        .catch(e=>say("Sincronizzazione non riuscita: "+(e.code||e.message)));
      setEditing(null);setView("home");say("Movimento eliminato");
    }catch(e){say("Errore: "+(e.code||e.message));}
  };
  // rinomina un'etichetta su tutti i movimenti che la usano (esclusa la riga in modifica, gia' salvata a parte)
  const renameEtichetta=(oldLabel,newLabel,excludeId)=>{
    const ids=tx.filter(t=>t.id!==excludeId && (t.etichetta||"").trim()===oldLabel).map(t=>t.id);
    ids.forEach(id=>fb.updateDoc(fb.doc(fb.db,"transactions",id),{etichetta:newLabel})
      .catch(e=>say("Sincronizzazione non riuscita: "+(e.code||e.message))));
    say(ids.length ? ("Cambiate le etichette di "+(ids.length+1)+" movimenti") : "Etichetta cambiata");
    return ids.length;
  };

  // spese ricorrenti: crea le occorrenze mancanti fino a oggi (tetto di 24 per regola ad ogni giro).
  // gli identificativi sono prevedibili (regola+data), quindi generare due volte non duplica nulla:
  // se apri l'app tu o Martina non importa, il risultato e' lo stesso.
  useEffect(()=>{
    if(!ready||!fb||!recurring.length) return;
    const oggi=today();
    const creati=[];
    (async()=>{
      for(const r of recurring){
        let cursore = r.lastGenerated ? prossimaOccorrenza(r.lastGenerated,r.cadence) : r.startDate;
        let conteggio=0, ultima=r.lastGenerated||null;
        const batchIds=[];
        while(cursore<=oggi && conteggio<24 && (!r.endDate || cursore<=r.endDate)){
          const docId="rec_"+r.id+"_"+cursore.replace(/-/g,"");
          batchIds.push({id:docId,date:cursore});
          ultima=cursore; conteggio++;
          cursore=prossimaOccorrenza(cursore,r.cadence);
        }
        if(!batchIds.length) continue;
        for(const b of batchIds){
          fb.setDoc(fb.doc(fb.db,"transactions",b.id),{
            date:b.date,type:r.type,amount:r.amount,groupId:r.groupId,leafId:r.leafId||null,subId:r.subId||null,
            note:r.note||"",etichetta:r.etichetta||"",shared:!!r.shared,splitMode:r.shared?r.splitMode:null,
            splitPercent:r.splitPercent||50,createdBy:r.createdBy,editedBy:null,source:"recurring",
            recurringRuleId:r.id,createdAt:fb.serverTimestamp()
          }).catch(()=>{});
          creati.push({label:r.note||"Spesa ricorrente",date:b.date,amount:r.amount});
        }
        fb.updateDoc(fb.doc(fb.db,"recurring",r.id),{lastGenerated:ultima}).catch(()=>{});
      }
      if(creati.length) setRecurringBanner(creati);
    })();
  },[ready,fb,recurring]);
  const dismissBanner=()=>setRecurringBanner(null);

  const saveCats=(c)=>{ setCats(c);
    try{ fb.setDoc(fb.doc(fb.db,"meta","categories"),c)
      .catch(e=>say("Sincronizzazione categorie non riuscita: "+(e.code||e.message)));
    }catch(e){say("Errore categorie: "+(e.code||e.message));} };

  const doBackup=async()=>{
    const n=tx.length;
    const fn="SPENDOMETRO_backup_"+today()+"_v1_"+n+"tx.json";
    const senzaPending=(arr)=>arr.map(({pending,...r})=>r); // pending e stato UI, non un dato
    const payload={schema:1,generato:new Date().toISOString(),da:user,
      transactions:senzaPending(tx),settlements:senzaPending(settlements),
      balances:senzaPending(balances),categories:cats,config};
    const blob=new Blob([JSON.stringify(payload,null,1)],{type:"application/json"});
    const testo=fn.replace(".json","")+"\n\nBackup Spendometro del "+today()+"\nMovimenti: "+n+
      "\nPer ritrovarlo cerca in Gmail: SPENDOMETRO_backup";
    const how=shareOrDownload(blob,fn,testo,(txt)=>setBackupText({fn,txt}));
    try{ fb.updateDoc(fb.doc(fb.db,"meta","config"),{lastBackup:today(),lastBackupBy:user}).catch(()=>{}); }catch(e){}
    setSimLock(false);
    say(how==="fallback"?"Backup mostrato a schermo":(how==="download"?"Backup scaricato: "+fn:"Backup pronto"+(config?.backupEmail?": invialo a "+config.backupEmail:"")));
  };

  if(fbErr) return <div style={{padding:24}}><b>Firebase non raggiungibile.</b><pre style={{fontSize:11}}>{String(fbErr)}</pre></div>;
  if(!fb||authUser===undefined) return <Splash msg="Avvio…" />;
  if(!authUser) return <Login fb={fb} />;
  if(!UIDS[authUser.uid]) return <Splash msg="Account non autorizzato." action={()=>fb.signOut(fb.auth)} />;
  if(!ready||!cats||!config) return <Splash msg="Carico i dati…" />;

  return (
    <Guard>
    <div style={{background:T.bg,minHeight:"100dvh"}}>
      <div style={{maxWidth:480,margin:"0 auto",paddingBottom:(view==="add"||view==="recur")?24:(locked?16:96)}}>
        <div style={{background:T.brand,position:"relative",overflow:"hidden"}}>
          {photo && <img src={photo} alt="" style={{position:"absolute",inset:0,width:"100%",height:"100%",objectFit:"cover",opacity:0.9}} />}
          {photo && <div style={{position:"absolute",inset:0,background:"linear-gradient(180deg,rgba(16,24,32,.55) 0%,rgba(16,24,32,.15) 45%,rgba(16,24,32,.65) 100%)"}} />}
          <div style={{position:"relative",paddingTop:"calc(14px + env(safe-area-inset-top))",paddingLeft:16,paddingRight:16,paddingBottom:14,minHeight:photo?128:0,display:"flex",flexDirection:"column",justifyContent:"space-between"}}>
            <div style={{display:"flex",justifyContent:"space-between",alignItems:"flex-start"}}>
              <div style={{color:"#fff",fontSize:19,fontWeight:800,letterSpacing:-0.5,textShadow:photo?"0 1px 6px rgba(0,0,0,.5)":"none"}}>Spendometro</div>
              <div style={{display:"flex",alignItems:"center",gap:8}}>
                <button onClick={()=>fb.signOut(fb.auth)} style={{background:photo?"rgba(16,24,32,.55)":"#33547C",color:"#fff",border:"none",padding:"6px 12px",borderRadius:20,fontSize:13,fontWeight:600,backdropFilter:"blur(4px)"}}>{USERS[user]}</button>
                <button onClick={manualRefresh} disabled={refreshing} aria-label="Aggiorna"
                  style={{background:photo?"rgba(16,24,32,.55)":"#33547C",border:"none",width:32,height:32,borderRadius:16,padding:0,display:"flex",alignItems:"center",justifyContent:"center",backdropFilter:"blur(4px)",flex:"0 0 auto"}}>
                  <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#fff" strokeWidth="2.4" strokeLinecap="round" strokeLinejoin="round"
                    style={{display:"block",transition:"transform .6s linear",transform:refreshing?"rotate(360deg)":"rotate(0deg)"}}>
                    <path d="M20 11a8 8 0 1 0-2.3 5.7"/>
                    <path d="M20 5v6h-6"/>
                  </svg>
                </button>
              </div>
            </div>
          </div>
        </div>

        {locked ? <BackupLock onBackup={doBackup} config={config} /> : (
          <div style={{padding:"0 14px"}}>
            {view==="home" && <Home {...{tx,user,meta,myBalance,fb,settlements,say,setEditing,setView,etichette,cats,
              recurring,recurringBanner,dismissBanner,esterni,condivisioni,
              scale:homeScale,setScale:setHomeScale,selKey:homeSelKey,setSelKey:setHomeSelKey,
              focusId:homeFocusId,clearFocus:()=>setHomeFocusId(null)}} />}
            {view==="add" && <AddEdit {...{cats,user,initial:editing,etichette,tx,renameEtichetta,say,esterni,fb,onSave:saveTx,onDelete:delTx,onCancel:()=>{setEditing(null);setView("home");}}} />}
            {view==="recur" && <RecurringForm {...{cats,user,fb,say,onCancel:()=>setView("home")}} />}
            {view==="report" && <Report {...{tx,user,meta,balances,fb,say,cats,condivisioni}} />}
            {view==="cats" && <CatsView {...{cats,saveCats,tx,say}} />}
            {view==="data" && <SchermataDati {...{tx,cats,meta,user,fb,doBackup,config,photo,setSimLock,say,detachTx,attachTx}} />}
          </div>
        )}

        {erroreGlobale && (
          <div style={{position:"fixed",inset:0,background:"rgba(0,0,0,.55)",zIndex:97,display:"flex",alignItems:"center",justifyContent:"center",padding:18}}>
            <Card style={{maxWidth:380}}>
              <div style={{fontSize:16,fontWeight:800,marginBottom:8}}>Firestore ha segnalato un problema interno</div>
              <div style={{fontSize:13,color:T.muted,lineHeight:1.5,marginBottom:10}}>Nessun dato e' andato perso: e' un errore del canale di comunicazione, non del database. Ricarica la pagina.</div>
              <pre style={{fontSize:10,background:T.bg,padding:8,borderRadius:8,overflowX:"auto",maxHeight:120}}>{erroreGlobale}</pre>
              <div style={{marginTop:10}}><Btn onClick={()=>location.reload()}>Ricarica l'app</Btn></div>
            </Card>
          </div>
        )}
        {toast && <div style={{position:"fixed",bottom:100,left:"50%",transform:"translateX(-50%)",background:T.ink,color:"#fff",padding:"10px 16px",borderRadius:10,fontSize:13,zIndex:99,maxWidth:360,textAlign:"center"}}>{toast}</div>}
        {backupText && (
          <div style={{position:"fixed",inset:0,background:"rgba(0,0,0,.5)",zIndex:95,display:"flex",alignItems:"center",justifyContent:"center",padding:16}}>
            <Card style={{maxWidth:420,width:"100%"}}>
              <div style={{fontSize:14,fontWeight:700}}>{backupText.fn}</div>
              <div style={{fontSize:12,color:T.muted,margin:"4px 0 8px"}}>Copia il testo e salvalo, oppure riprova dal telefono.</div>
              <textarea readOnly value={backupText.txt} style={{width:"100%",height:160,fontSize:10,fontFamily:"monospace",borderRadius:8,border:"1px solid "+T.line,padding:8,boxSizing:"border-box"}} />
              <div style={{marginTop:8}}><Btn onClick={()=>setBackupText(null)}>Chiudi</Btn></div>
            </Card>
          </div>
        )}
      </div>
      {!locked && view!=="add" && view!=="recur" && (
          <div id="barra" style={{background:T.surface,borderTop:"1px solid "+T.line,display:"flex",maxWidth:480,margin:"0 auto",width:"100%"}}>
            {NAV.map(([k,l,Icon])=>(
              <button key={k} onClick={()=>setView(k)} style={{flex:1,background:"none",border:"none",padding:"10px 4px 8px",display:"flex",flexDirection:"column",alignItems:"center",gap:3,color:view===k?T.brand:T.muted}}>
                <Icon/>
                <span style={{fontSize:11,fontWeight:700}}>{l}</span>
              </button>
            ))}
            <button onClick={()=>{setEditing(null);setView("add");}} style={{position:"absolute",right:12,top:-46,width:56,height:56,borderRadius:28,background:T.brand,color:"#fff",border:"3px solid "+T.bg,fontSize:30,lineHeight:1,padding:0,display:"flex",alignItems:"center",justifyContent:"center",boxShadow:"0 3px 12px rgba(0,0,0,.22)"}}><span style={{display:"block",marginTop:-2}}>+</span></button>
          </div>
        )}

        {!online && <div style={{position:"fixed",top:0,left:0,right:0,background:"#B8860B",color:"#fff",fontSize:12,fontWeight:700,textAlign:"center",paddingTop:"calc(5px + env(safe-area-inset-top))",paddingBottom:5,paddingLeft:8,paddingRight:8,zIndex:98,boxSizing:"border-box"}}>Offline · le modifiche si sincronizzano al ritorno della rete</div>}
    </div>
    </Guard>
  );
}
// icone di navigazione: linea monocroma, ereditano il colore del pulsante (currentColor)

const IconChart=()=><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.8" strokeLinecap="round" strokeLinejoin="round"><path d="M4 20V10M12 20V4M20 20v-7"/></svg>;

  <div style={{background:T.brand,minHeight:"100vh",display:"flex",flexDirection:"column",justifyContent:"center",alignItems:"center",color:"#fff",paddingTop:"calc(24px + env(safe-area-inset-top))",paddingLeft:24,paddingRight:24,paddingBottom:24,boxSizing:"border-box"}}>

/* ---------- Login ---------- */
function Login({fb}){
  const [email,setEmail]=useState(""),[pw,setPw]=useState("");
  const [err,setErr]=useState(""),[busy,setBusy]=useState(false);
  const go=async()=>{
    setBusy(true);setErr("");
    try{ await fb.signInWithEmailAndPassword(fb.auth,email.trim(),pw); }
    catch(e){ setErr(e.code==="auth/invalid-credential"?"Email o password non corretti":e.code); }
    setBusy(false);
  };
  return (
    <div style={{background:T.brand,minHeight:"100vh",display:"flex",flexDirection:"column",justifyContent:"center",paddingTop:"calc(26px + env(safe-area-inset-top))",paddingLeft:26,paddingRight:26,paddingBottom:26,boxSizing:"border-box"}}>
      <div style={{color:"#fff",fontSize:38,fontWeight:800,letterSpacing:-1.4}}>Spendometro</div>
      <div style={{color:"#9DB4CE",fontSize:14,marginBottom:28}}>Dipartimento contabile del PMAS</div>
      <input placeholder="Email" value={email} onChange={e=>setEmail(e.target.value)} type="email" autoComplete="username" style={{...sel2,marginBottom:9}} />
      <input placeholder="Password" value={pw} onChange={e=>setPw(e.target.value)} type="password" autoComplete="current-password"
        onKeyDown={e=>e.key==="Enter"&&go()} style={{...sel2,marginBottom:12}} />
      {err && <div style={{color:"#FFC9C0",fontSize:13,marginBottom:10}}>{err}</div>}
      <Btn onClick={go} disabled={busy||!email||!pw} style={{background:"#fff",color:T.brand}}>{busy?"Accesso…":"Entra"}</Btn>
      <button onClick={async()=>{ if(!email) return setErr("Scrivi prima l'email");
          try{ await fb.sendPasswordResetEmail(fb.auth,email.trim()); setErr("Email di reimpostazione inviata"); }catch(e){setErr(e.code);} }}
        style={{background:"none",border:"none",color:"#9DB4CE",fontSize:12.5,marginTop:16}}>Password dimenticata</button>
      <div style={{color:"#7B96B4",fontSize:11.5,marginTop:18,lineHeight:1.5}}>L'accesso si fa una volta sola. Aggiungi l'app alla schermata Home per mantenere la sessione.</div>
    </div>
  );
}

/* ---------- Blocco backup ---------- */
function BackupLock({onBackup,config}){
  return (
    <div style={{padding:20,paddingTop:"calc(20px + env(safe-area-inset-top))"}}>
      <Card style={{background:T.warnSoft,borderColor:"#E8D9A8"}}>
        <div style={{fontSize:17,fontWeight:800,marginBottom:6}}>Backup del mese richiesto</div>
        <div style={{fontSize:13.5,lineHeight:1.55,color:"#5C4A16"}}>
          L'app resta bloccata finché non salvi il backup. Ultimo backup: <b>{config.lastBackup||"mai"}</b>.
          Premi il pulsante, scegli Mail e invialo alla tua email.
        </div>
        <div style={{marginTop:14}}><Btn onClick={onBackup}>Backup database</Btn></div>
      </Card>
    </div>
  );
}

/* ---------- Home ---------- */
/* ---------- card spese ricorrenti (mostrata in Spese, sotto il conguaglio) ---------- */
/* ---------- card unificata: debito con Martina + con ciascuna persona esterna ---------- */
function SpeseCondiviseCard({user,myBalance,esterni,condivisioni,settlements,fb,say}){
  const [nuovoNome,setNuovoNome]=useState("");
  const [addingPerson,setAddingPerson]=useState(false);
  const [confirmDel,setConfirmDel]=useState(null);       // esterno in attesa di rimozione
  const [confirmSettle,setConfirmSettle]=useState(null); // {nome,importo,direzione} in attesa di conferma
  const iOwe=myBalance<-0.005;

  const aggiungiPersona=()=>{
    const n=nuovoNome.trim(); if(!n) return;
    fb.addDoc(fb.collection(fb.db,"esterni"),{name:n,createdBy:user,createdAt:fb.serverTimestamp()})
      .catch(e=>say("Errore: "+(e.code||e.message)));
    setNuovoNome(""); setAddingPerson(false); say("Persona aggiunta");
  };
  const eliminaPersona=()=>{
    fb.deleteDoc(fb.doc(fb.db,"esterni",confirmDel.id)).catch(e=>say("Errore: "+(e.code||e.message)));
    say(confirmDel.name+" rimosso dalle spese condivise"); setConfirmDel(null);
  };
  const settleGenerico=()=>{
    const {nome,importo,direzione}=confirmSettle;
    const from = direzione==="devo" ? user : nome;
    const to   = direzione==="devo" ? nome : user;
    fb.addDoc(fb.collection(fb.db,"settlements"),
      {date:today(),amount:Math.round(importo*100)/100,from,to,createdAt:fb.serverTimestamp()})
      .catch(e=>say("Errore: "+(e.code||e.message)));
    say("Conguaglio registrato"); setConfirmSettle(null);
  };

  return (
    <Card style={{marginTop:10}}>
      <div style={{fontSize:11.5,color:T.muted,fontWeight:700,letterSpacing:1,textTransform:"uppercase",marginBottom:8}}>Spese condivise</div>

      {Math.abs(myBalance)<0.005 ? (
        <div style={{fontSize:14,color:T.muted,padding:"6px 0",borderBottom:esterni.length?"1px solid "+T.line:"none"}}>Nessun debito aperto con {USERS[other(user)]}.</div>
      ) : (
        <div style={{display:"flex",alignItems:"center",gap:10,padding:"6px 0",borderBottom:esterni.length?"1px solid "+T.line:"none"}}>
          <div style={{flex:1,fontSize:14}}>
            {iOwe?<>Devi a <b>{USERS[other(user)]}</b></>:<><b>{USERS[other(user)]}</b> ti deve</>}
            <div style={{fontSize:21,fontWeight:800,color:iOwe?T.out:T.in,fontVariantNumeric:"tabular-nums"}}>{eur(Math.abs(myBalance))}</div>
          </div>
          <Btn kind={iOwe?"primary":"ghost"} onClick={()=>setConfirmSettle({nome:other(user),importo:Math.abs(myBalance),direzione:iOwe?"devo":"midevono"})}
            style={{width:"auto",padding:"10px 16px"}}>Conguaglio</Btn>
        </div>
      )}

      {esterni.map((es,i)=>{
        const saldo=saldoConPersona(condivisioni,user,es.name,settlements);
        const gliDevo=saldo<-0.005, midevePoco=Math.abs(saldo)<0.005;
        return (
          <div key={es.id} style={{display:"flex",alignItems:"center",gap:8,padding:"7px 0",borderBottom:i<esterni.length-1?"1px solid "+T.line:"none"}}>
            <button onClick={()=>setConfirmDel(es)} aria-label={"Rimuovi "+es.name}
              style={{background:"none",border:"none",color:T.muted,fontSize:15,padding:"0 4px",flex:"0 0 auto"}}>✕</button>
            <div style={{flex:1,fontSize:14,minWidth:0}}>
              {midevePoco ? <><b>{es.name}</b> <span style={{color:T.muted,fontSize:12.5}}>nessun debito</span></> :
                gliDevo ? <>Devi a <b>{es.name}</b></> : <><b>{es.name}</b> ti deve</>}
              {!midevePoco && <div style={{fontSize:17,fontWeight:800,color:gliDevo?T.out:T.in,fontVariantNumeric:"tabular-nums"}}>{eur(Math.abs(saldo))}</div>}
            </div>
            {!midevePoco && (
              <Btn kind={gliDevo?"primary":"ghost"} onClick={()=>setConfirmSettle({nome:es.name,importo:Math.abs(saldo),direzione:gliDevo?"devo":"midevono"})}
                style={{width:"auto",padding:"8px 12px",fontSize:13,flex:"0 0 auto"}}>Conguaglio</Btn>
            )}
          </div>
        );
      })}

      {addingPerson ? (
        <div style={{display:"flex",gap:6,marginTop:9}}>
          <input placeholder="Nome della persona" value={nuovoNome} onChange={e=>setNuovoNome(e.target.value)}
            onKeyDown={e=>e.key==="Enter"&&aggiungiPersona()} autoFocus
            style={{...sel2,padding:"8px 10px",fontSize:14}} />
          <button onClick={aggiungiPersona} style={{background:T.brandSoft,border:"1px solid "+T.brand,color:T.brand,borderRadius:9,padding:"0 14px",fontWeight:700}}>Ok</button>
          <button onClick={()=>{setAddingPerson(false);setNuovoNome("");}} style={{background:"none",border:"1px solid "+T.line,borderRadius:9,padding:"0 10px",color:T.muted}}>✕</button>
        </div>
      ) : (
        <div style={{marginTop:9}}><Btn kind="ghost" onClick={()=>setAddingPerson(true)}>Aggiungi persona</Btn></div>
      )}

      {confirmDel && (
        <div style={{position:"fixed",inset:0,background:"rgba(0,0,0,.45)",display:"flex",alignItems:"center",justifyContent:"center",padding:22,zIndex:90}}>
          <Card style={{maxWidth:320}}>
            <div style={{fontSize:16,fontWeight:700,marginBottom:8}}>Rimuovere {confirmDel.name}?</div>
            <div style={{fontSize:14,lineHeight:1.5,marginBottom:16}}>Le spese già registrate con {confirmDel.name} restano invariate.</div>
            <div style={{display:"flex",gap:8}}>
              <Btn kind="ghost" onClick={()=>setConfirmDel(null)}>Annulla</Btn>
              <Btn kind="danger" onClick={eliminaPersona}>Rimuovi</Btn>
            </div>
          </Card>
        </div>
      )}
      {confirmSettle && (
        <div style={{position:"fixed",inset:0,background:"rgba(0,0,0,.45)",display:"flex",alignItems:"center",justifyContent:"center",padding:22,zIndex:90}}>
          <Card style={{maxWidth:320}}>
            <div style={{fontSize:16,fontWeight:700,marginBottom:8}}>Conferma conguaglio</div>
            <div style={{fontSize:14.5,lineHeight:1.5,marginBottom:16}}>
              {confirmSettle.direzione==="devo"
                ? <>Hai versato <b>{eur(confirmSettle.importo)}</b> a <b>{NOME_PARTECIPANTE(confirmSettle.nome)}</b>?</>
                : <><b>{NOME_PARTECIPANTE(confirmSettle.nome)}</b> ti ha versato <b>{eur(confirmSettle.importo)}</b>?</>}
            </div>
            <div style={{display:"flex",gap:8}}>
              <Btn kind="ghost" onClick={()=>setConfirmSettle(null)}>No</Btn>
              <Btn onClick={settleGenerico}>Sì</Btn>
            </div>
          </Card>
        </div>
      )}
    </Card>
  );
}

function RecurringCard({recurring,cats,user,fb,say,setView}){
  const [sel,setSel]=useState(new Set());
  const [confirmDel,setConfirmDel]=useState(false);
  const meta1=(r)=>{ const lf=cats.leaves.find(x=>x.id===r.leafId); const g=cats.groups.find(x=>x.id===r.groupId); return {leaf:lf,group:g}; };
  const toggle=(id)=>setSel(s=>{const n=new Set(s); n.has(id)?n.delete(id):n.add(id); return n;});
  const elimina=()=>{
    [...sel].forEach(id=>fb.deleteDoc(fb.doc(fb.db,"recurring",id)).catch(e=>say("Errore: "+(e.code||e.message))));
    say((sel.size>1?"Eliminate "+sel.size+" regole":"Regola eliminata")+". Le spese già create restano.");
    setSel(new Set()); setConfirmDel(false);
  };
  return (
    <Card style={{marginTop:10}}>
      <div style={{fontSize:11.5,color:T.muted,fontWeight:700,letterSpacing:1,textTransform:"uppercase",marginBottom:8}}>Spese ricorrenti</div>
      {recurring.length===0 ? (
        <div style={{fontSize:13.5,color:T.muted,marginBottom:10}}>Nessuna regola attiva. Utile per abbonamenti e bollette che tornano sempre uguali.</div>
      ) : (
        <div style={{maxHeight:150,overflowY:"auto",marginBottom:10}}>
          {recurring.map(r=>{
            const {leaf,group}=meta1(r);
            return (
              <div key={r.id} onClick={()=>toggle(r.id)} style={{display:"flex",alignItems:"center",gap:9,padding:"7px 2px",borderBottom:"1px solid "+T.line,cursor:"pointer"}}>
                <div style={{width:18,height:18,borderRadius:5,border:"2px solid "+(sel.has(r.id)?T.brand:T.line),background:sel.has(r.id)?T.brand:"#fff",flex:"0 0 auto",color:"#fff",fontSize:12,lineHeight:"15px",textAlign:"center"}}>{sel.has(r.id)?"✓":""}</div>
                <div style={{fontSize:17}}>{group?group.icon:"📌"}</div>
                <div style={{flex:1,minWidth:0}}>
                  <div style={{fontSize:13.5,fontWeight:600,whiteSpace:"nowrap",overflow:"hidden",textOverflow:"ellipsis"}}>{leaf?leaf.name:(group?group.name:"?")}{r.note?" · "+r.note:""}</div>
                  <div style={{fontSize:11,color:T.muted}}>{cadenzaTesto(r)}{r.endDate?" · fino al "+r.endDate.slice(8,10)+"/"+r.endDate.slice(5,7)+"/"+r.endDate.slice(0,4):""}</div>
                </div>
                <div style={{fontWeight:700,fontSize:13.5,color:r.type==="income"?T.in:T.out,fontVariantNumeric:"tabular-nums"}}>{r.type==="income"?"+":"−"}{eur(r.amount).slice(1)}</div>
              </div>
            );
          })}
        </div>
      )}
      {sel.size>0 ? (
        <Btn kind="danger" onClick={()=>setConfirmDel(true)}>Elimina {sel.size>1?sel.size+" regole":"regola"}</Btn>
      ) : (
        <Btn kind="ghost" onClick={()=>setView("recur")}>+ Aggiungi spesa ricorrente</Btn>
      )}
      {confirmDel && (
        <div style={{position:"fixed",inset:0,background:"rgba(0,0,0,.45)",display:"flex",alignItems:"center",justifyContent:"center",padding:22,zIndex:90}}>
          <Card style={{maxWidth:340}}>
            <div style={{fontSize:16,fontWeight:700,marginBottom:8}}>Eliminare {sel.size>1?"queste "+sel.size+" regole":"questa regola"}?</div>
            <div style={{fontSize:14,lineHeight:1.5,marginBottom:16}}>Le spese già registrate in passato restano invariate. Solo la generazione futura si ferma.</div>
            <div style={{display:"flex",gap:8}}>
              <Btn kind="ghost" onClick={()=>setConfirmDel(false)}>Annulla</Btn>
              <Btn kind="danger" onClick={elimina}>Elimina</Btn>
            </div>
          </Card>
        </div>
      )}
    </Card>
  );
}

function Home({tx,user,meta,myBalance,fb,settlements,say,setEditing,setView,etichette,cats,
               recurring,recurringBanner,dismissBanner,esterni,condivisioni,
               scale,setScale,selKey,setSelKey,focusId,clearFocus}){
  const [sel,setSel]=useState(null);          // null = modalita normale, Set = selezione (etichetta)
  const [selDel,setSelDel]=useState(null);    // null = modalita normale, Set = selezione (eliminazione)
  const [confirmDelSel,setConfirmDelSel]=useState(false);
  const [nuovaEt,setNuovaEt]=useState("");
  const [busyEt,setBusyEt]=useState(false);
  const [highlightId,setHighlightId]=useState(null);
  const rowRefs=useRef({});
  const scroller=useRef(null);
  const mine=useMemo(()=>tx.map(t=>({t,q:shareFor(t,user)})).filter(x=>x.q>0.0001),[tx,user]);
  const key=(d)=>scale==="mese"?d.slice(0,7):d.slice(0,4);
  const buckets=useMemo(()=>{
    const m={};
    mine.forEach(({t,q})=>{const k=key(t.date);m[k]=m[k]||{k,in:0,out:0};
      if(t.type==="income")m[k].in+=q;else m[k].out+=q;});
    return Object.values(m).sort((a,b)=>a.k.localeCompare(b.k));
  },[mine,scale]);
  // quando cambia scala (mese/anno) o i bucket, se il periodo selezionato non esiste piu' si torna all'ultimo
  useEffect(()=>{
    if(!buckets.length) return;
    if(!buckets.some(b=>b.k===selKey)) setSelKey(buckets[buckets.length-1].k);
  },[buckets]);
  const cur=buckets.find(b=>b.k===selKey) || buckets[buckets.length-1] || {k:today().slice(0,7),in:0,out:0};
  const label=(k)=>scale==="mese"?MESI[+k.slice(5,7)-1]+" "+k.slice(2,4):k;
  // l'elenco mostra SOLO il periodo selezionato: tutto lo storico e' cosi' raggiungibile scorrendo il grafico
  const recent=useMemo(()=>mine.filter(x=>key(x.t.date)===cur.k).sort((a,b)=>b.t.date.localeCompare(a.t.date)),[mine,cur.k,scale]);

  const [visMax,setVisMax]=useState(1);
  const recalc=()=>{const el=scroller.current;if(!el||!buckets.length)return;
    const item=el.scrollWidth/buckets.length;
    const a=Math.max(0,Math.floor(el.scrollLeft/item));
    const b=Math.min(buckets.length,Math.ceil((el.scrollLeft+el.clientWidth)/item));
    const w=buckets.slice(a,Math.max(a+1,b));
    setVisMax(Math.max(1,...w.map(x=>Math.max(x.in,x.out))));};
  useEffect(()=>{ if(scroller.current){scroller.current.scrollLeft=scroller.current.scrollWidth;}
    const id=setTimeout(recalc,60); return ()=>clearTimeout(id);},[buckets,scale]);
  const max=visMax;

  // torna sulla riga appena modificata: scorre fino a lei e la evidenzia per un istante.
  // "clearFocus" avvisa il padre che puo' dimenticare focusId: farlo troppo presto pero'
  // fa ripartire QUESTO effetto, la cui pulizia annullerebbe i timer gia' programmati.
  // Per questo clearFocus si chiama DOPO che lo scorrimento e' gia' partito, non prima.
  useEffect(()=>{
    if(!focusId) return;
    const id=focusId;
    if(recent.some(x=>x.t.id===id)){
      setHighlightId(id);
      setTimeout(()=>{
        const el=rowRefs.current[id]; if(el) el.scrollIntoView({block:"center",behavior:"smooth"});
        clearFocus();
      },80);
    } else {
      clearFocus();
    }
  },[focusId]);
  // il timer che spegne l'evidenziazione e' un effetto a parte, legato solo a highlightId:
  // cosi' non viene mai annullato dal cambio di focusId qui sopra.
  useEffect(()=>{
    if(!highlightId) return;
    const t=setTimeout(()=>setHighlightId(null),1800);
    return ()=>clearTimeout(t);
  },[highlightId]);

  const applica=(et)=>{
    setBusyEt(true);
    const ids=[...sel];
    ids.forEach(id=>{
      fb.updateDoc(fb.doc(fb.db,"transactions",id),{etichetta:et})
        .catch(e=>say("Sincronizzazione non riuscita: "+(e.code||e.message)));
    });
    setBusyEt(false); setSel(null); setNuovaEt("");
    say(et?("Etichetta \""+et+"\" applicata a "+ids.length):"Etichetta rimossa da "+ids.length);
  };

  const eliminaSelezionati=()=>{
    const ids=[...selDel];
    ids.forEach(id=>fb.deleteDoc(fb.doc(fb.db,"transactions",id)).catch(e=>say("Errore: "+(e.code||e.message))));
    say("Eliminati "+ids.length+" movimenti");
    setSelDel(null); setConfirmDelSel(false);
  };

  return (<>
    {recurringBanner && recurringBanner.length>0 && (
      <Card style={{marginTop:14,background:T.warnSoft,borderColor:"#E8D9A8"}}>
        <div style={{display:"flex",justifyContent:"space-between",alignItems:"flex-start",gap:8}}>
          <div style={{fontSize:13.5,fontWeight:700,color:"#5C4A16"}}>Aggiunte {recurringBanner.length} spese ricorrenti</div>
          <button onClick={dismissBanner} style={{background:"none",border:"none",color:"#5C4A16",fontSize:15,padding:0}}>✕</button>
        </div>
        <div style={{marginTop:6}}>
          {recurringBanner.slice(0,10).map((c,i)=>(
            <div key={i} style={{fontSize:12.5,color:"#5C4A16"}}>· {c.label} · {c.date.slice(8,10)}/{c.date.slice(5,7)} · {eur(c.amount)}</div>
          ))}
          {recurringBanner.length>10 && <div style={{fontSize:12.5,color:"#5C4A16"}}>… e altre {recurringBanner.length-10}</div>}
        </div>
      </Card>
    )}

    <div style={{display:"flex",gap:6,margin:"14px 0 10px"}}>
      {["mese","anno"].map(s=>(
        <button key={s} onClick={()=>setScale(s)} style={{flex:1,padding:9,borderRadius:9,border:"1px solid "+(scale===s?T.brand:T.line),background:scale===s?T.brandSoft:T.surface,color:scale===s?T.brand:T.muted,fontWeight:700,fontSize:13}}>Per {s}</button>
      ))}
    </div>

    <Card>
      <div style={{fontSize:11.5,color:T.muted,fontWeight:700,letterSpacing:1,textTransform:"uppercase"}}>Flusso di cassa · {label(cur.k)}</div>
      <div style={{fontSize:34,fontWeight:800,letterSpacing:-1.4,margin:"6px 0 2px",color:cur.in-cur.out>=0?T.in:T.out,fontVariantNumeric:"tabular-nums"}}>{eur(cur.in-cur.out)}</div>
      <div style={{display:"flex",gap:18,fontSize:13,color:T.muted}}>
        <span>Entrate <b style={{color:T.in}}>{eur(cur.in)}</b></span>
        <span>Uscite <b style={{color:T.out}}>{eur(cur.out)}</b></span>
      </div>
    </Card>

    <SpeseCondiviseCard {...{user,myBalance,esterni,condivisioni,settlements,fb,say}} />

    <RecurringCard {...{recurring,cats,user,fb,say,setView}} />

    <H>Andamento {scale==="mese"?"mensile":"annuale"}</H>
    <Card style={{padding:"14px 10px"}}>
      <div style={{display:"flex"}}>
        <div style={{flex:"0 0 auto",width:46,height:110,position:"relative",marginRight:4}}>
          {[1,0.5,0].map(f=><div key={f} style={{position:"absolute",right:0,top:(1-f)*110-6,fontSize:9.5,color:T.muted,fontVariantNumeric:"tabular-nums"}}>{eur0(max*f)}</div>)}
        </div>
        <div ref={scroller} onScroll={recalc} style={{overflowX:"auto",display:"flex",gap:12,alignItems:"flex-end",paddingBottom:6,flex:1,borderLeft:"1px solid "+T.line,paddingLeft:8}}>
          {buckets.map(b=>{
            const attivo=b.k===cur.k;
            return (
            <button key={b.k} onClick={()=>setSelKey(b.k)} style={{flex:"0 0 auto",textAlign:"center",width:44,background:attivo?T.brandSoft:"none",border:"none",borderRadius:8,padding:"4px 0 2px"}}>
              <div style={{display:"flex",gap:3,alignItems:"flex-end",justifyContent:"center",height:110}}>
                <div style={{width:15,height:Math.max(2,Math.min(110,(b.in/max)*110)),background:T.in,borderRadius:"3px 3px 0 0",opacity:attivo?1:.55}} />
                <div style={{width:15,height:Math.max(2,Math.min(110,(b.out/max)*110)),background:T.out,borderRadius:"3px 3px 0 0",opacity:attivo?1:.55}} />
              </div>
              <div style={{fontSize:10,color:attivo?T.brand:T.muted,marginTop:5,fontWeight:attivo?800:600}}>{label(b.k)}</div>
            </button>
          );})}
        </div>
      </div>
      <div style={{fontSize:11,color:T.muted,marginTop:4,textAlign:"center"}}>Scorri e tocca un periodo per vederne i movimenti · verde entrate, rosso uscite</div>
    </Card>

    <div style={{margin:"16px 0 7px"}}>
      <div style={{fontSize:11,letterSpacing:1.2,textTransform:"uppercase",color:T.muted,fontWeight:700,marginBottom:7}}>{label(cur.k)} · solo la tua quota</div>
      <div style={{display:"flex",gap:6}}>
        <button onClick={()=>{setSel(sel?null:new Set());setNuovaEt("");setSelDel(null);}}
          style={{flex:1,background:sel?T.brand:T.surface,color:sel?"#fff":T.brand,border:"1px solid "+T.brand,
          borderRadius:16,padding:"6px 8px",fontSize:12,fontWeight:700}}>{sel?"Annulla":"Applica etichetta"}</button>
        <button onClick={()=>{setSelDel(selDel?null:new Set());setSel(null);}}
          style={{flex:1,background:selDel?T.out:T.surface,color:selDel?"#fff":T.out,border:"1px solid "+T.out,
          borderRadius:16,padding:"6px 8px",fontSize:12,fontWeight:700}}>{selDel?"Annulla":"Cancella spese"}</button>
      </div>
    </div>
    {sel && (
      <Card style={{marginBottom:8,background:"#F3EFF9",borderColor:"#D8CCEA"}}>
        <div style={{fontSize:13,marginBottom:8}}>Tocca i movimenti da etichettare. Selezionati: <b>{sel.size}</b></div>
        <EtichettaInput value={nuovaEt} onChange={setNuovaEt} options={etichette} placeholder="Etichetta nuova o esistente" />
        <div style={{display:"flex",gap:8,marginTop:9}}>
          <Btn kind="ghost" disabled={!sel.size||busyEt} onClick={()=>applica("")}>Togli etichetta</Btn>
          <Btn disabled={!sel.size||!nuovaEt.trim()||busyEt} onClick={()=>applica(nuovaEt.trim())}>
            {busyEt?"Applico…":"Applica a "+sel.size}</Btn>
        </div>
      </Card>
    )}
    {selDel && (
      <Card style={{marginBottom:8,background:"#FBEAE6",borderColor:"#F0C4B8"}}>
        <div style={{fontSize:13,marginBottom:8}}>Tocca i movimenti da eliminare. Selezionati: <b>{selDel.size}</b></div>
        <Btn kind="danger" disabled={!selDel.size} onClick={()=>setConfirmDelSel(true)}>Elimina {selDel.size||""} movimenti</Btn>
      </Card>
    )}
    {confirmDelSel && (
      <div style={{position:"fixed",inset:0,background:"rgba(0,0,0,.45)",display:"flex",alignItems:"center",justifyContent:"center",padding:22,zIndex:90}}>
        <Card style={{maxWidth:340}}>
          <div style={{fontSize:16,fontWeight:700,marginBottom:8}}>Eliminare {selDel.size} movimenti?</div>
          <div style={{fontSize:14,lineHeight:1.5,marginBottom:16}}>L'operazione non si può annullare.</div>
          <div style={{display:"flex",gap:8}}>
            <Btn kind="ghost" onClick={()=>setConfirmDelSel(false)}>Annulla</Btn>
            <Btn kind="danger" onClick={eliminaSelezionati}>Elimina</Btn>
          </div>
        </Card>
      </div>
    )}
    <Card style={{padding:"4px 14px"}}>
      {recent.length===0 && <div style={{padding:"14px 0",fontSize:13.5,color:T.muted}}>Nessun movimento in {label(cur.k)}.</div>}
      {recent.map(({t,q},i)=>{
        const {leaf,group,sub}=meta(t);
        const k=key(t.date), prev=i>0?key(recent[i-1].t.date):null, head=k!==prev;
        const titolo=scale==="mese"?MESILUNGHI[+k.slice(5,7)-1]+" "+k.slice(0,4):k;
        return (<React.Fragment key={t.id}>
          {head && <div style={{position:"sticky",top:-1,background:T.surface,padding:"10px 0 6px",borderBottom:"2px solid "+T.brand,marginTop:i?10:0,zIndex:2}}>
            <span style={{fontSize:12.5,fontWeight:800,letterSpacing:.6,textTransform:"uppercase",color:T.brand}}>{titolo}</span></div>}
          <div ref={el=>{rowRefs.current[t.id]=el;}}
            onClick={()=>{
              if(selDel){ const n=new Set(selDel); n.has(t.id)?n.delete(t.id):n.add(t.id); setSelDel(n); return; }
              if(sel){ const n=new Set(sel); n.has(t.id)?n.delete(t.id):n.add(t.id); setSel(n); return; }
              setEditing(t); setView("add");
            }}
            style={{display:"flex",gap:10,alignItems:"center",padding:"10px 0",borderBottom:"1px solid "+T.line,
            background:highlightId===t.id?T.brandSoft:(selDel&&selDel.has(t.id)?"#FBEAE6":(sel&&sel.has(t.id)?"#F3EFF9":"transparent")),
            transition:"background .5s ease"}}>
            {selDel && <div style={{width:20,height:20,borderRadius:5,border:"2px solid "+(selDel.has(t.id)?T.out:T.line),
              background:selDel.has(t.id)?T.out:"#fff",color:"#fff",fontSize:13,lineHeight:"17px",textAlign:"center",flex:"0 0 auto"}}>{selDel.has(t.id)?"✓":""}</div>}
            {sel && <div style={{width:20,height:20,borderRadius:5,border:"2px solid "+(sel.has(t.id)?"#7A5AA8":T.line),
              background:sel.has(t.id)?"#7A5AA8":"#fff",color:"#fff",fontSize:13,lineHeight:"17px",textAlign:"center",flex:"0 0 auto"}}>{sel.has(t.id)?"✓":""}</div>}
            <div style={{fontSize:20}}>{group?group.icon:"📌"}</div>
            <div style={{flex:1,minWidth:0}}>
              <div style={{fontSize:14,fontWeight:600,whiteSpace:"nowrap",overflow:"hidden",textOverflow:"ellipsis"}}>
                {sub?sub.name:(leaf?leaf.name:(group?group.name:"?"))}{t.note?<span style={{color:T.muted,fontWeight:400}}> · {t.note}</span>:null}</div>
              <div style={{fontSize:11.5,color:T.muted}}>
                {t.date.slice(8,10)}/{t.date.slice(5,7)} · {group?group.name:""}{sub&&leaf?" · "+leaf.name:""} · {L2LABEL[group?group.l2:""]}
                {t.shared&&<span style={{color:T.brand,fontWeight:700}}> · {condivisioneTesto(t)}</span>}
                {t.createdBy!==user&&<span> · da {USERS[t.createdBy]}</span>}
                {t.editedBy&&<span> · mod. {USERS[t.editedBy]}</span>}
              </div>
              {t.etichetta&&<div style={{fontSize:11.5,color:"#7A5AA8",fontWeight:700}}>{t.etichetta}</div>}
              {t.pending&&<div style={{fontSize:11.5,color:"#B8860B",fontWeight:700}}>in attesa</div>}
            </div>
            <div style={{fontWeight:700,fontSize:14.5,color:t.type==="income"?T.in:T.out,fontVariantNumeric:"tabular-nums"}}>{t.type==="income"?"+":"−"}{eur(q).slice(1)}</div>
          </div>
        </React.Fragment>);
      })}
    </Card>
  </>);
}

/* ---------- Inserimento / modifica ---------- */
function AddEdit({cats,user,initial,onSave,onDelete,onCancel,etichette,tx,renameEtichetta,say,esterni,fb}){
  // chi ha creato la spesa e' un fatto fisso: usarlo come ancora, non chi sta guardando lo
  // schermo in questo momento, altrimenti "pagato da me" cambia significato a seconda di chi legge.
  const payer=initial?initial.createdBy:user;
  const o=other(payer);
  const [kind,setKind]=useState(initial?(initial.shared?(initial.type==="income"?"ic":"ec"):(initial.type==="income"?"i":"e")):"e");
  const [expr,setExpr]=useState(initial?String(initial.amount):"");
  const [mode,setMode]=useState(initial?.splitMode||"paid_by_me_split");
  const [pct,setPct]=useState(initial?.splitPercent||50);
  const [date,setDate]=useState(initial?.date||today());
  const [note,setNote]=useState(initial?.note||"");
  const [leafId,setLeafId]=useState(initial?.leafId||null);
  const [subId,setSubId]=useState(initial?.subId||null);
  const [etichetta,setEtichetta]=useState(initial?.etichetta||"");
  const [confirmRename,setConfirmRename]=useState(false);
  const [busy,setBusy]=useState(false);
  // spesa condivisa con terzi: chi partecipa, chi ha pagato
  const [terziSel,setTerziSel]=useState(()=>new Set((esterni||[]).map(e=>e.name)));
  const [intSel,setIntSel]=useState({pierangelo:true,martina:true});
  const [pagante,setPagante]=useState(user);

  const shared=kind==="ec"||kind==="ic";
  const terzi3=kind==="ec3";
  const type=(kind==="i"||kind==="ic")?"income":"expense";
  const l1=type==="income"?"entrate":"spese";
  const [l2,setL2]=useState(()=>{
    if(initial){ const g=cats.groups.find(x=>x.id===initial.groupId)
        ||(initial.leafId?cats.groups.find(x=>x.id===(cats.leaves.find(y=>y.id===initial.leafId)||{}).groupId):null);
      if(g) return g.l2; return initial.type==="income"?"stipendio":"variabili"; }
    return "variabili";});
  const [gid,setGid]=useState(()=>{
    if(!initial) return null;
    if(initial.groupId&&cats.groups.some(g=>g.id===initial.groupId)) return initial.groupId;
    const lf=cats.leaves.find(x=>x.id===initial.leafId); return lf?lf.groupId:null;});
  const first=useRef(true);
  useEffect(()=>{ if(first.current){first.current=false;return;}
    if(l1==="entrate"&&(l2==="fisse"||l2==="variabili")){setL2("stipendio");setGid(null);setLeafId(null);}
    if(l1==="spese"&&(l2==="stipendio"||l2==="altre_entrate")){setL2("variabili");setGid(null);setLeafId(null);}
  },[l1]);

  const groups=cats.groups.filter(g=>g.l2===l2&&!g.archived);
  const leaves=cats.leaves.filter(l=>l.groupId===gid&&!l.archived);
  const subs=(cats.subs||[]).filter(x=>x.leafId===leafId&&!x.archived);
  const val=calc(expr);

  // spesa con terzi: elenco partecipanti (sempre te/Martina se spuntati, poi gli esterni spuntati)
  const listaPartecipanti=[...(intSel.pierangelo?["pierangelo"]:[]),...(intSel.martina?["martina"]:[]),...[...terziSel]];
  const perShare3=listaPartecipanti.length?val/listaPartecipanti.length:0;
  useEffect(()=>{
    if(terzi3 && listaPartecipanti.length && !listaPartecipanti.includes(pagante)) setPagante(listaPartecipanti[0]);
  },[terzi3,listaPartecipanti.join("|")]);

  const okBase=!isNaN(val)&&val>0&&gid&&!busy;
  const ok=terzi3 ? (okBase&&(intSel.pierangelo||intSel.martina)&&listaPartecipanti.length>=2&&pagante) : okBase;
  const K=({c,act})=><button onClick={act||(()=>setExpr(expr+c))} style={{flex:1,padding:"15px 0",fontSize:19,fontWeight:600,background:T.surface,border:"1px solid "+T.line,borderRadius:10}}>{c}</button>;

  // rinomina etichetta: quanti ALTRI movimenti (esclusa questa riga) usano ancora l'etichetta vecchia
  const vecchiaEt=(initial?.etichetta||"").trim();
  const nuovaEtT=etichetta.trim();
  const altriConEtichetta=useMemo(()=>{
    if(!vecchiaEt || !tx) return 0;
    return tx.filter(t=>t.id!==initial?.id && (t.etichetta||"").trim()===vecchiaEt).length;
  },[tx,vecchiaEt,initial]);
  const ePropriaRinomina = initial && vecchiaEt && nuovaEtT && nuovaEtT!==vecchiaEt;

  const costruisciPayload=()=>({id:initial?.id,date,type,
    amount:Math.round(val*100)/100,groupId:gid,leafId:leafId||null,subId:subId||null,
    note,etichetta:nuovaEtT,shared,
    splitMode:shared?mode:null,splitPercent:pct});

  const eseguiSalvataggio=(rinominaOvunque)=>{
    setConfirmRename(false); setBusy(true);
    if(rinominaOvunque && renameEtichetta && altriConEtichetta>0){
      renameEtichetta(vecchiaEt,nuovaEtT,initial?.id);
      onSave(costruisciPayload());
    } else {
      onSave(costruisciPayload());
      if(ePropriaRinomina && say) say("Cambiata solamente l'etichetta di questo movimento");
    }
  };

  // spesa condivisa con terzi: registro a parte (condivisioni) + una spesa vera per ciascun
  // partecipante interno (Pierangelo e/o Martina). I terzi non hanno un conto, restano solo nel registro.
  const salvaConTerzi=()=>{
    setBusy(true);
    try{
      const ref=fb.doc(fb.collection(fb.db,"condivisioni"));
      const quota=Math.round(perShare3*100)/100, totale=Math.round(val*100)/100;
      fb.setDoc(ref,{date,amount:totale,note:note.trim(),etichetta:nuovaEtT,
        groupId:gid,leafId:leafId||null,subId:subId||null,
        participants:listaPartecipanti,payer:pagante,perShare:quota,total:totale,
        createdBy:user,createdAt:fb.serverTimestamp()})
        .catch(e=>say("Sincronizzazione non riuscita: "+(e.code||e.message)));
      ["pierangelo","martina"].forEach(persona=>{
        if(!listaPartecipanti.includes(persona)) return;
        fb.addDoc(fb.collection(fb.db,"transactions"),{
          date,type:"expense",amount:quota,groupId:gid,leafId:leafId||null,subId:subId||null,
          note:note.trim(),etichetta:nuovaEtT,shared:false,splitMode:null,splitPercent:50,
          createdBy:persona,editedBy:null,source:"terzi",
          thirdParty:{participants:listaPartecipanti,payer:pagante,perShare:quota,total:totale,condivisioneId:ref.id},
          createdAt:fb.serverTimestamp()
        }).catch(e=>say("Sincronizzazione non riuscita: "+(e.code||e.message)));
      });
      say("Spesa condivisa registrata"); onCancel();
    }catch(e){ say("Errore: "+(e.code||e.message)); setBusy(false); }
  };

  const handleSaveClick=()=>{
    if(terzi3){ salvaConTerzi(); return; }
    if(ePropriaRinomina && altriConEtichetta>0){ setConfirmRename(true); return; }
    setBusy(true); onSave(costruisciPayload());
  };

  return (
    <div style={{paddingTop:14}}>
      <div style={{fontSize:19,fontWeight:800,marginBottom:12}}>{initial?"Modifica movimento":"Nuovo movimento"}</div>
      <select value={kind} onChange={e=>setKind(e.target.value)} style={sel2}>
        <option value="e">Spesa</option><option value="i">Entrata</option>
        <option value="ec">Spesa condivisa</option><option value="ic">Entrata condivisa</option>
        {esterni&&esterni.length>0 && <option value="ec3">Spesa condivisa con terzi</option>}
      </select>

      <Card style={{margin:"10px 0"}}>
        <div style={{fontSize:12,color:T.muted,fontWeight:700}}>{type==="income"?"ENTRATA +":"USCITA −"}</div>
        <div style={{fontSize:30,fontWeight:800,fontVariantNumeric:"tabular-nums",letterSpacing:-1,color:type==="income"?T.in:T.out,minHeight:40,wordBreak:"break-all"}}>{expr||"0"}</div>
        <div style={{fontSize:13,color:isNaN(val)?T.out:T.muted}}>{expr?(isNaN(val)?"espressione non valida":"= "+eur(val)):"digita o calcola, e.g. 12.50+4"}</div>
        <div style={{display:"grid",gridTemplateColumns:"repeat(4,1fr)",gap:6,marginTop:10}}>
          {["7","8","9","("].map(c=><K key={c} c={c}/>)}
          {["4","5","6",")"].map(c=><K key={c} c={c}/>)}
          {["1","2","3","+"].map(c=><K key={c} c={c}/>)}
          {[".","0","-","*"].map(c=><K key={c} c={c}/>)}
          <K c="/"/><K c="⌫" act={()=>setExpr(expr.slice(0,-1))}/><K c="C" act={()=>setExpr("")}/>
          <K c="=" act={()=>{const v=calc(expr);if(!isNaN(v))setExpr(String(Math.round(v*100)/100));}}/>
        </div>
      </Card>

      {shared && (
        <Card style={{marginBottom:10}}>
          <div style={{fontSize:12,fontWeight:700,color:T.muted,marginBottom:6}}>CONDIVISIONE</div>
          <select value={mode} onChange={e=>setMode(e.target.value)} style={sel2}>
            {["paid_by_me_split","paid_by_other_split","i_owe_full","other_owes_full"].map(m=><option key={m} value={m}>{SPLITLABEL(m,USERS[payer],USERS[o],type)}</option>)}
          </select>
          {(mode==="paid_by_me_split"||mode==="paid_by_other_split") && (
            <select value={pct} onChange={e=>setPct(+e.target.value)} style={{...sel2,marginTop:8}}>
              {[10,20,30,40,50,60,70,80,90].map(p=><option key={p} value={p}>Quota {USERS[payer]} {p}% · {USERS[o]} {100-p}%</option>)}
            </select>
          )}
          {!isNaN(val)&&val>0 && (
            <div style={{fontSize:12.5,color:T.muted,marginTop:8,background:T.brandSoft,padding:9,borderRadius:8}}>
              A {USERS[payer]} {eur(shareFor({type,amount:val,shared:true,splitMode:mode,splitPercent:pct,createdBy:payer},payer))} · a {USERS[o]} {eur(shareFor({type,amount:val,shared:true,splitMode:mode,splitPercent:pct,createdBy:payer},o))}
            </div>
          )}
        </Card>
      )}

      {terzi3 && (
        <Card style={{marginBottom:10}}>
          <div style={{fontSize:12,fontWeight:700,color:T.muted,marginBottom:6}}>CHI HA PARTECIPATO</div>
          <div style={{display:"flex",flexWrap:"wrap",gap:6,marginBottom:10}}>
            {[["pierangelo","Pierangelo"],["martina","Martina"]].map(([k,l])=>(
              <button key={k} onClick={()=>setIntSel(s=>({...s,[k]:!s[k]}))}
                style={{padding:"7px 12px",borderRadius:18,border:"1px solid "+(intSel[k]?T.brand:T.line),background:intSel[k]?T.brandSoft:T.surface,fontSize:13,fontWeight:600}}>{intSel[k]?"✓ ":""}{l}</button>
            ))}
            {(esterni||[]).map(es=>(
              <button key={es.id} onClick={()=>setTerziSel(s=>{const n=new Set(s); n.has(es.name)?n.delete(es.name):n.add(es.name); return n;})}
                style={{padding:"7px 12px",borderRadius:18,border:"1px solid "+(terziSel.has(es.name)?T.brand:T.line),background:terziSel.has(es.name)?T.brandSoft:T.surface,fontSize:13,fontWeight:600}}>{terziSel.has(es.name)?"✓ ":""}{es.name}</button>
            ))}
          </div>
          {!(intSel.pierangelo||intSel.martina) && <div style={{fontSize:12,color:T.out,marginBottom:8}}>Deve partecipare almeno tu o Martina.</div>}
          {listaPartecipanti.length<2 && (intSel.pierangelo||intSel.martina) && <div style={{fontSize:12,color:T.out,marginBottom:8}}>Seleziona almeno un'altra persona da dividere con te.</div>}
          <div style={{fontSize:12,fontWeight:700,color:T.muted,marginBottom:6}}>PAGATO DA</div>
          <select value={pagante} onChange={e=>setPagante(e.target.value)} style={sel2} disabled={!listaPartecipanti.length}>
            {listaPartecipanti.map(p=><option key={p} value={p}>{NOME_PARTECIPANTE(p)}</option>)}
          </select>
          {!isNaN(val)&&val>0&&listaPartecipanti.length>=2 && (
            <div style={{fontSize:12.5,color:T.muted,marginTop:9,background:T.brandSoft,padding:9,borderRadius:8,lineHeight:1.6}}>
              Quota a testa: <b>{eur(perShare3)}</b> ({listaPartecipanti.length} persone)<br/>
              {listaPartecipanti.map(p=>(
                <span key={p} style={{display:"block"}}>
                  {p===pagante ? <>{NOME_PARTECIPANTE(p)} ha pagato {eur(val)}</> :
                    (p==="pierangelo"||p==="martina") ? <>{NOME_PARTECIPANTE(p)}: sua spesa {eur(perShare3)}, deve a {NOME_PARTECIPANTE(pagante)}</> :
                    <>{p} deve a {NOME_PARTECIPANTE(pagante)} {eur(perShare3)}</>}
                </span>
              ))}
            </div>
          )}
        </Card>
      )}

      <Card style={{marginBottom:10}}>
        <div style={{fontSize:12,fontWeight:700,color:T.muted,marginBottom:6}}>CATEGORIA</div>
        <div style={{display:"flex",gap:6,marginBottom:8}}>
          {(l1==="spese"?["fisse","variabili"]:["stipendio","altre_entrate"]).map(k=>(
            <button key={k} onClick={()=>{setL2(k);setGid(null);setLeafId(null);}} style={{flex:1,padding:9,borderRadius:9,border:"1px solid "+(l2===k?T.brand:T.line),background:l2===k?T.brandSoft:T.surface,fontWeight:700,fontSize:13}}>{L2LABEL[k]}</button>
          ))}
        </div>
        <div style={{display:"flex",flexWrap:"wrap",gap:6,marginBottom:gid?10:0}}>
          {groups.map(g=>(
            <button key={g.id} onClick={()=>{setGid(g.id);setLeafId(null);}} style={{padding:"7px 10px",borderRadius:18,border:"1px solid "+(gid===g.id?T.brand:T.line),background:gid===g.id?T.brandSoft:T.surface,fontSize:13}}>{g.icon} {g.name}</button>
          ))}
        </div>
        {gid && (<>
          <div style={{fontSize:11,color:T.muted,marginBottom:5}}>Dettaglio (facoltativo, tocca di nuovo per togliere)</div>
          <div style={{display:"flex",flexWrap:"wrap",gap:6}}>
            {leaves.map(l=>(
              <button key={l.id} onClick={()=>{setLeafId(leafId===l.id?null:l.id);setSubId(null);}} style={{padding:"7px 10px",borderRadius:8,border:"1px solid "+(leafId===l.id?T.brand:T.line),background:leafId===l.id?T.brand:T.surface,color:leafId===l.id?"#fff":T.ink,fontSize:12.5}}>{l.name}</button>
            ))}
          </div>
          {subs.length>0 && (<>
            <div style={{fontSize:11,color:T.muted,margin:"8px 0 5px"}}>Dettaglio specifico</div>
            <div style={{display:"flex",flexWrap:"wrap",gap:6}}>
              {subs.map(x=>(
                <button key={x.id} onClick={()=>setSubId(subId===x.id?null:x.id)} style={{padding:"6px 9px",borderRadius:8,border:"1px solid "+(subId===x.id?"#7A5AA8":T.line),background:subId===x.id?"#7A5AA8":T.surface,color:subId===x.id?"#fff":T.ink,fontSize:12}}>{x.name}</button>
              ))}
            </div>
          </>)}
        </>)}
      </Card>

      <Card style={{marginBottom:12,overflow:"hidden"}}>
        <input type="date" value={date} onChange={e=>setDate(e.target.value)} style={{...sel2,WebkitAppearance:"none",appearance:"none",minWidth:0,maxWidth:"100%",display:"block"}} />
        <input placeholder="Nota (facoltativa)" value={note} onChange={e=>setNote(e.target.value)} style={{...sel2,marginTop:8}} />
        <div style={{marginTop:8}}>
          <EtichettaInput value={etichetta} onChange={setEtichetta} options={etichette} placeholder="Etichetta (es. Viaggio in Giappone)" />
        </div>
      </Card>

      <Btn disabled={!ok} onClick={handleSaveClick}>{initial?"Salva modifiche":"Registra movimento"}</Btn>
      {initial && <div style={{marginTop:8}}><Btn kind="danger" onClick={()=>onDelete(initial.id)}>Elimina movimento</Btn></div>}
      <div style={{marginTop:8,marginBottom:8}}><Btn kind="ghost" onClick={onCancel}>Annulla</Btn></div>

      {confirmRename && (
        <div style={{position:"fixed",inset:0,background:"rgba(0,0,0,.45)",display:"flex",alignItems:"center",justifyContent:"center",padding:22,zIndex:90}}>
          <Card style={{maxWidth:340}}>
            <div style={{fontSize:16,fontWeight:700,marginBottom:8}}>Rinominare l'etichetta ovunque?</div>
            <div style={{fontSize:14,lineHeight:1.5,marginBottom:16}}>
              Hai cambiato "<b>{initial?.etichetta}</b>" in "<b>{etichetta.trim()}</b>". Altri <b>{altriConEtichetta}</b> movimenti usano ancora l'etichetta vecchia.
            </div>
            <div style={{display:"flex",flexDirection:"column",gap:8}}>
              <Btn kind="ghost" onClick={()=>eseguiSalvataggio(false)}>Solo questo movimento</Btn>
              <Btn onClick={()=>eseguiSalvataggio(true)}>Rinomina ovunque ({altriConEtichetta})</Btn>
            </div>
          </Card>
        </div>
      )}
    </div>
  );
}

/* ---------- Modulo di creazione: spesa ricorrente ---------- */
function RecurringForm({cats,user,fb,say,onCancel}){
  const o=other(user);
  const [kind,setKind]=useState("e");   // e, i, ec, ic — stesso schema di AddEdit
  const [expr,setExpr]=useState("");
  const [mode,setMode]=useState("paid_by_me_split");
  const [pct,setPct]=useState(50);
  const [note,setNote]=useState("");
  const [etichetta,setEtichetta]=useState("");
  const [leafId,setLeafId]=useState(null);
  const [subId,setSubId]=useState(null);
  const [cadence,setCadence]=useState("monthly");
  const [startDate,setStartDate]=useState(today());
  const [endDate,setEndDate]=useState("");
  const [busy,setBusy]=useState(false);

  const shared=kind==="ec"||kind==="ic";
  const type=(kind==="i"||kind==="ic")?"income":"expense";
  const l1=type==="income"?"entrate":"spese";
  const [l2,setL2]=useState("variabili");
  const first=useRef(true);
  useEffect(()=>{ if(first.current){first.current=false;return;}
    if(l1==="entrate"&&(l2==="fisse"||l2==="variabili")){setL2("stipendio");setGid(null);setLeafId(null);}
    if(l1==="spese"&&(l2==="stipendio"||l2==="altre_entrate")){setL2("variabili");setGid(null);setLeafId(null);}
  },[l1]);
  const [gid,setGid]=useState(null);

  const groups=cats.groups.filter(g=>g.l2===l2&&!g.archived);
  const leaves=cats.leaves.filter(l=>l.groupId===gid&&!l.archived);
  const subs=(cats.subs||[]).filter(x=>x.leafId===leafId&&!x.archived);
  const val=numDec(expr)||calc(expr);
  const importoValido=!isNaN(val)&&val>0;
  const ok=importoValido&&gid&&startDate;

  const K=({c,act})=><button onClick={act||(()=>setExpr(expr+c))} style={{flex:1,padding:"15px 0",fontSize:19,fontWeight:600,background:T.surface,border:"1px solid "+T.line,borderRadius:10}}>{c}</button>;

  const salva=()=>{
    setBusy(true);
    try{
      fb.addDoc(fb.collection(fb.db,"recurring"),{
        type,amount:Math.round(val*100)/100,groupId:gid,leafId:leafId||null,subId:subId||null,
        note:note.trim(),etichetta:etichetta.trim(),shared,splitMode:shared?mode:null,splitPercent:pct,
        cadence,startDate,endDate:endDate||null,lastGenerated:null,
        createdBy:user,createdAt:fb.serverTimestamp()
      }).catch(e=>say("Sincronizzazione non riuscita: "+(e.code||e.message)));
      say("Spesa ricorrente creata"); onCancel();
    }catch(e){ say("Errore: "+(e.code||e.message)); setBusy(false); }
  };

  return (
    <div style={{paddingTop:14}}>
      <div style={{fontSize:19,fontWeight:800,marginBottom:12}}>Nuova spesa ricorrente</div>

      <select value={kind} onChange={e=>setKind(e.target.value)} style={sel2}>
        <option value="e">Spesa</option><option value="i">Entrata</option>
        <option value="ec">Spesa condivisa</option><option value="ic">Entrata condivisa</option>
      </select>

      <Card style={{margin:"10px 0"}}>
        <div style={{fontSize:12,color:T.muted,fontWeight:700}}>{type==="income"?"ENTRATA +":"USCITA −"}</div>
        <div style={{fontSize:30,fontWeight:800,fontVariantNumeric:"tabular-nums",letterSpacing:-1,color:type==="income"?T.in:T.out,minHeight:40,wordBreak:"break-all"}}>{expr||"0"}</div>
        <div style={{fontSize:13,color:isNaN(val)?T.out:T.muted}}>{expr?(isNaN(val)?"espressione non valida":"= "+eur(val)):"digita l'importo fisso"}</div>
        <div style={{display:"grid",gridTemplateColumns:"repeat(4,1fr)",gap:6,marginTop:10}}>
          {["7","8","9","("].map(c=><K key={c} c={c}/>)}
          {["4","5","6",")"].map(c=><K key={c} c={c}/>)}
          {["1","2","3","+"].map(c=><K key={c} c={c}/>)}
          {[".","0","-","*"].map(c=><K key={c} c={c}/>)}
          <K c="/"/><K c="⌫" act={()=>setExpr(expr.slice(0,-1))}/><K c="C" act={()=>setExpr("")}/>
          <K c="=" act={()=>{const v=calc(expr);if(!isNaN(v))setExpr(String(Math.round(v*100)/100));}}/>
        </div>
      </Card>

      {shared && (
        <Card style={{marginBottom:10}}>
          <div style={{fontSize:12,fontWeight:700,color:T.muted,marginBottom:6}}>CONDIVISIONE</div>
          <select value={mode} onChange={e=>setMode(e.target.value)} style={sel2}>
            {["paid_by_me_split","paid_by_other_split","i_owe_full","other_owes_full"].map(m=><option key={m} value={m}>{SPLITLABEL(m,USERS[user],USERS[o],type)}</option>)}
          </select>
          {(mode==="paid_by_me_split"||mode==="paid_by_other_split") && (
            <select value={pct} onChange={e=>setPct(+e.target.value)} style={{...sel2,marginTop:8}}>
              {[10,20,30,40,50,60,70,80,90].map(p=><option key={p} value={p}>Quota {USERS[user]} {p}% · {USERS[o]} {100-p}%</option>)}
            </select>
          )}
        </Card>
      )}

      <Card style={{marginBottom:10}}>
        <div style={{fontSize:12,fontWeight:700,color:T.muted,marginBottom:6}}>CATEGORIA</div>
        <div style={{display:"flex",gap:6,marginBottom:8}}>
          {(l1==="spese"?["fisse","variabili"]:["stipendio","altre_entrate"]).map(k=>(
            <button key={k} onClick={()=>{setL2(k);setGid(null);setLeafId(null);}} style={{flex:1,padding:9,borderRadius:9,border:"1px solid "+(l2===k?T.brand:T.line),background:l2===k?T.brandSoft:T.surface,fontWeight:700,fontSize:13}}>{L2LABEL[k]}</button>
          ))}
        </div>
        <div style={{display:"flex",flexWrap:"wrap",gap:6,marginBottom:gid?10:0}}>
          {groups.map(g=>(
            <button key={g.id} onClick={()=>{setGid(g.id);setLeafId(null);}} style={{padding:"7px 10px",borderRadius:18,border:"1px solid "+(gid===g.id?T.brand:T.line),background:gid===g.id?T.brandSoft:T.surface,fontSize:13}}>{g.icon} {g.name}</button>
          ))}
        </div>
        {gid && (<>
          <div style={{fontSize:11,color:T.muted,marginBottom:5}}>Dettaglio (facoltativo)</div>
          <div style={{display:"flex",flexWrap:"wrap",gap:6}}>
            {leaves.map(l=>(
              <button key={l.id} onClick={()=>{setLeafId(leafId===l.id?null:l.id);setSubId(null);}} style={{padding:"7px 10px",borderRadius:8,border:"1px solid "+(leafId===l.id?T.brand:T.line),background:leafId===l.id?T.brand:T.surface,color:leafId===l.id?"#fff":T.ink,fontSize:12.5}}>{l.name}</button>
            ))}
          </div>
          {subs.length>0 && (<>
            <div style={{fontSize:11,color:T.muted,margin:"8px 0 5px"}}>Dettaglio specifico</div>
            <div style={{display:"flex",flexWrap:"wrap",gap:6}}>
              {subs.map(x=>(
                <button key={x.id} onClick={()=>setSubId(subId===x.id?null:x.id)} style={{padding:"6px 9px",borderRadius:8,border:"1px solid "+(subId===x.id?"#7A5AA8":T.line),background:subId===x.id?"#7A5AA8":T.surface,color:subId===x.id?"#fff":T.ink,fontSize:12}}>{x.name}</button>
              ))}
            </div>
          </>)}
        </>)}
      </Card>

      <Card style={{marginBottom:10}}>

        {cadence==="weekly" && startDate && <div style={{fontSize:11.5,color:T.muted,marginTop:5}}>Si ripeterà ogni {WEEKDAYS[new Date(startDate+"T00:00:00").getDay()].toLowerCase()}.</div>}
        <div style={{fontSize:11,color:T.muted,margin:"9px 0 5px"}}>Data di fine (facoltativa)</div>
        <div style={{display:"flex",gap:6}}>

            style={{background:T.bg,border:"1px solid "+T.line,borderRadius:10,padding:"0 14px",color:T.muted,fontSize:15,flex:"0 0 auto"}}>✕</button>}

      <Card style={{marginBottom:12}}>
