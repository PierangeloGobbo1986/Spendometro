/* ---------- riepilogo di viaggio: chi deve cosa a chi, nettato, per una singola etichetta ---------- */
function RiepilogoViaggio({condivisioni}){
  const etichetteDisponibili=useMemo(()=>[...new Set((condivisioni||[]).map(c=>(c.etichetta||"").trim()).filter(Boolean))].sort(),[condivisioni]);
  const [scelta,setScelta]=useState("");
  if(!etichetteDisponibili.length) return null;  // nessuna spesa con terzi etichettata: la sezione resta nascosta
  const {docs,risultati} = scelta ? riepilogoEtichetta(condivisioni,scelta) : {docs:[],risultati:[]};

  return (<>
    <H>5 · Riepilogo per etichetta (viaggi e gruppi)</H>
    <Card>
      <div style={{fontSize:12.5,color:T.muted,marginBottom:9,lineHeight:1.5}}>Scegli l'etichetta di un viaggio o gruppo per vedere chi deve cosa a chi, spese con terzi comprese.</div>
      <select value={scelta} onChange={e=>setScelta(e.target.value)} style={sel2}>
        <option value="">Scegli un'etichetta…</option>
        {etichetteDisponibili.map(et=><option key={et} value={et}>{et}</option>)}
      </select>
      {scelta && (
        <div style={{marginTop:12}}>
          <div style={{fontSize:12,fontWeight:700,color:T.muted,marginBottom:7}}>{docs.length} spese con terzi in questa etichetta</div>
          {risultati.length===0 ? (
            <div style={{fontSize:13.5,color:T.muted}}>Tutti i conti tornano, nessun debito residuo.</div>
          ) : risultati.map((r,i)=>(
            <div key={i} style={{display:"flex",justifyContent:"space-between",alignItems:"center",padding:"8px 0",borderBottom:"1px solid "+T.line}}>
              <span style={{fontSize:14}}><b>{NOME_PARTECIPANTE(r.da)}</b> deve a <b>{NOME_PARTECIPANTE(r.a)}</b></span>
              <b style={{fontVariantNumeric:"tabular-nums",fontSize:15}}>{eur(r.importo)}</b>
            </div>
          ))}
        </div>
      )}
    </Card>
  </>);
}

function Report({tx,user,meta,balances,fb,say,cats,condivisioni}){
  const [rev,setRev]=useState(""),[fin,setFin]=useState(""),[int,setInt]=useState("");
  const [scale,setScale]=useState("anno");             // vale per l'intero report, tranne il grafico patrimoni
  const [contiVis,setContiVis]=useState({revolut:true,fineco:true,intesa:true});
  const [delBalance,setDelBalance]=useState(null);      // rilevazione in attesa di conferma eliminazione
  const analisiRef=useRef(null);                        // ultimo stato dell'analisi per categoria, per la stampa
  const mine=useMemo(()=>tx.map(t=>({t,q:shareFor(t,user)})).filter(x=>x.q>0.0001),[tx,user]);
  const pkey=(d)=>scale==="mese"?d.slice(0,7):d.slice(0,4);
  const shortLab=(k)=>scale==="mese"?MESI[+k.slice(5,7)-1]+" "+k.slice(2,4):k;
  const longLab=(k)=>scale==="mese"?MESILUNGHI[+k.slice(5,7)-1]+" "+k.slice(0,4):k;

  const byPeriod=useMemo(()=>{
    const m={};
    mine.forEach(({t,q})=>{const k=pkey(t.date),g=meta(t).group;if(!g)return;
      m[k]=m[k]||{k,fisse:0,variabili:0,entrate:0};
      if(t.type==="income")m[k].entrate+=q;else m[k][g.l2]+=q;});
    return Object.values(m).sort((a,b)=>a.k.localeCompare(b.k));
  },[mine,scale]);

  const addSnapshot=()=>{
    if(!rev&&!fin&&!int) return say("Inserisci almeno un valore");
    try{ fb.addDoc(fb.collection(fb.db,"balances"),
      {date:today(),revolut:numDec(rev),fineco:numDec(fin),intesa:numDec(int),createdBy:user,createdAt:fb.serverTimestamp()})
      .catch(e=>say("Sincronizzazione non riuscita: "+(e.code||e.message)));
      setRev("");setFin("");setInt("");say("Rilevazione salvata");}catch(e){say("Errore: "+(e.code||e.message));}
  };

  // grafico a istogrammi scorrevole: colori fissi per serie, oppure una funzione (riga,indice)=>colore
  // per i casi in cui il colore dipende dal segno del valore (es. netto positivo/negativo).
  const Bars=({rows,keys,colors,labelKey,onBarClick,activeKey})=>{
    const box=useRef(null);
    const full=Math.max(1,...rows.flatMap(r=>keys.map(k=>Math.abs(r[k]||0))));
    const [max,setMax]=useState(full);
    const recalc=()=>{const el=box.current;if(!el||!rows.length)return;
      const item=el.scrollWidth/rows.length;
      const a=Math.max(0,Math.floor(el.scrollLeft/item));
      const b=Math.min(rows.length,Math.ceil((el.scrollLeft+el.clientWidth)/item));
      const w=rows.slice(a,Math.max(a+1,b));
      setMax(Math.max(1,...w.flatMap(r=>keys.map(k=>Math.abs(r[k]||0)))));};
    useEffect(()=>{ if(box.current) box.current.scrollLeft=box.current.scrollWidth;
      const id=setTimeout(recalc,60);return ()=>clearTimeout(id);},[rows,keys.join("|")]);
    const colorAt=(r,i)=>typeof colors==="function"?colors(r,i):colors[i];
    const Slot=onBarClick?"button":"div";
    return (
      <div style={{display:"flex",padding:"8px 0"}}>
        <div style={{flex:"0 0 auto",width:48,height:100,position:"relative",marginRight:4}}>
          {[1,0.5,0].map(f=><div key={f} style={{position:"absolute",right:0,top:(1-f)*100-6,fontSize:9.5,color:T.muted,fontVariantNumeric:"tabular-nums"}}>{eur0(max*f)}</div>)}
        </div>
        <div ref={box} onScroll={recalc} style={{display:"flex",gap:14,alignItems:"flex-end",overflowX:"auto",flex:1,borderLeft:"1px solid "+T.line,paddingLeft:8}}>
          {rows.map(r=>(
            <Slot key={r[labelKey]} onClick={onBarClick?()=>onBarClick(r.k):undefined}
              style={{flex:"0 0 auto",textAlign:"center",background:onBarClick&&activeKey===r.k?T.brandSoft:"none",border:"none",borderRadius:8,padding:onBarClick?"4px 2px 2px":0}}>
              <div style={{display:"flex",gap:4,alignItems:"flex-end",height:100}}>
                {keys.map((k,i)=><div key={k} style={{width:17,height:Math.max(2,Math.min(100,(Math.abs(r[k]||0)/max)*100)),background:colorAt(r,i),borderRadius:"3px 3px 0 0",opacity:(r[k]||0)<0?0.5:(onBarClick&&activeKey&&activeKey!==r.k?0.55:1)}} />)}
              </div>
              <div style={{fontSize:10.5,color:onBarClick&&activeKey===r.k?T.brand:T.muted,marginTop:5,fontWeight:onBarClick&&activeKey===r.k?800:600}}>{r[labelKey]}</div>
            </Slot>
          ))}
        </div>
      </div>);
  };
  // in schermo mostra al massimo 5 righe con scorrimento verticale; in stampa la tabella e' sempre intera
  const Tab=({head,rows})=>(
    <div className="tabscroll" style={{overflowX:"auto",overflowY:rows.length>5?"auto":"visible",maxHeight:rows.length>5?190:"none"}}>
      <table style={{width:"100%",borderCollapse:"collapse",fontSize:12.5,fontVariantNumeric:"tabular-nums"}}>
        <thead><tr>{head.map((h,i)=><th key={i} style={{textAlign:i?"right":"left",padding:"6px 5px",borderBottom:"2px solid "+T.line,color:T.muted,fontSize:10.5,textTransform:"uppercase",whiteSpace:"nowrap",position:"sticky",top:0,background:T.surface}}>{h}</th>)}</tr></thead>
        <tbody>{rows.map((r,i)=><tr key={i}>{r.map((c,j)=><td key={j} style={{textAlign:j?"right":"left",padding:"6px 5px",borderBottom:"1px solid "+T.line,color:(j%2===0&&j)?T.muted:T.ink,whiteSpace:"nowrap"}}>{c}</td>)}</tr>)}</tbody>
      </table>
    </div>);

  return (
    <div style={{paddingTop:14}}>
      <div style={{fontSize:19,fontWeight:800,marginBottom:4}}>Report · {USERS[user]}</div>
      <div style={{fontSize:12.5,color:T.muted,marginBottom:10}}>Cifre precise e, a destra di ciascuna, l'arrotondamento al centinaio più vicino.</div>

      <div style={{display:"flex",gap:6,marginBottom:14}}>
        {["mese","anno"].map(s=>(
          <button key={s} onClick={()=>setScale(s)} style={{flex:1,padding:9,borderRadius:9,border:"1px solid "+(scale===s?T.brand:T.line),background:scale===s?T.brandSoft:T.surface,color:scale===s?T.brand:T.muted,fontWeight:700,fontSize:13}}>Per {s}</button>
        ))}
      </div>

      <H>1 · Fisse, variabili ed entrate {scale==="mese"?"per mese":"per anno"}</H>
      <Card>
        <Bars rows={byPeriod} keys={["fisse","variabili","entrate"]} colors={[T.brand,"#7FA3C7",T.in]} labelKey="k" />
        <div style={{fontSize:11,color:T.muted,marginBottom:2}}>■ fisse ■ variabili ■ entrate · scorri per il resto dello storico</div>
      </Card>
      <Card style={{marginTop:8}}>
        <Tab head={[scale==="mese"?"Mese":"Anno","Fisse","~100","Variabili","~100","Entrate","~100"]}
          rows={[...byPeriod].reverse().map(r=>[longLab(r.k),eur(r.fisse),eur0(round100(r.fisse)),eur(r.variabili),eur0(round100(r.variabili)),eur(r.entrate),eur0(round100(r.entrate))])} />
      </Card>

      <H>2 · Patrimoni per rilevazione</H>
      <Card>
        <div style={{display:"flex",gap:6,marginBottom:8,flexWrap:"wrap"}}>
          {[["revolut","Revolut","#2E6BE6"],["fineco","Fineco",T.brand],["intesa","Intesa","#0E8A6A"]].map(([k,l,c])=>(
            <button key={k} onClick={()=>setContiVis(v=>({...v,[k]:!v[k]}))}
              style={{display:"flex",alignItems:"center",gap:5,padding:"5px 10px",borderRadius:16,border:"1px solid "+(contiVis[k]?c:T.line),background:contiVis[k]?c+"1F":T.surface,fontSize:12,fontWeight:600,color:contiVis[k]?c:T.muted}}>
              <span style={{width:8,height:8,borderRadius:2,background:contiVis[k]?c:T.line}} />{l}
            </button>
          ))}
        </div>
        {(()=>{ const contiColors={revolut:"#2E6BE6",fineco:T.brand,intesa:"#0E8A6A"};
          const contiKeys=["revolut","fineco","intesa"].filter(k=>contiVis[k]);
          return contiKeys.length===0 ? (
            <div style={{fontSize:13.5,color:T.muted,padding:"10px 0"}}>Seleziona almeno un conto per vedere il grafico.</div>
          ) : (<>
            <Bars rows={balances.map(b=>({...b,lab:b.date.slice(2,7)}))} keys={contiKeys} colors={contiKeys.map(k=>contiColors[k])} labelKey="lab" />
            <div style={{fontSize:11,color:T.muted,marginBottom:2}}>Segue le date delle rilevazioni, non il periodo scelto sopra. La tabella sotto resta sempre completa.</div>
          </>);
        })()}
      </Card>
      <Card style={{marginTop:8}}>
        <div className="tabscroll" style={{overflowX:"auto",overflowY:balances.length>5?"auto":"visible",maxHeight:balances.length>5?190:"none"}}>
          <table style={{width:"100%",borderCollapse:"collapse",fontSize:12.5,fontVariantNumeric:"tabular-nums"}}>
            <thead><tr>{["Data","Revolut","~100","Fineco","~100","Intesa","~100","Totale","~100",""].map((h,i)=>
              <th key={i} style={{textAlign:i&&i<9?"right":"left",padding:"6px 5px",borderBottom:"2px solid "+T.line,color:T.muted,fontSize:10.5,textTransform:"uppercase",whiteSpace:"nowrap",position:"sticky",top:0,background:T.surface}}>{h}</th>)}</tr></thead>
            <tbody>
              {[...balances].reverse().map(b=>{const tot=b.revolut+b.fineco+b.intesa;
                const cells=[b.date,eur(b.revolut),eur0(round100(b.revolut)),eur(b.fineco),eur0(round100(b.fineco)),eur(b.intesa),eur0(round100(b.intesa)),eur(tot),eur0(round100(tot))];
                return (<tr key={b.id}>
                  {cells.map((c,j)=><td key={j} style={{textAlign:j?"right":"left",padding:"6px 5px",borderBottom:"1px solid "+T.line,color:(j%2===0&&j)?T.muted:T.ink,whiteSpace:"nowrap"}}>{c}</td>)}
                  <td style={{textAlign:"right",padding:"6px 2px",borderBottom:"1px solid "+T.line}}>
                    <button onClick={()=>setDelBalance(b)} aria-label="Elimina rilevazione" style={{background:"none",border:"none",color:T.out,fontSize:14,padding:"2px 5px"}}>✕</button>

              })}

          </table>
        </div>
        <div style={{borderTop:"1px solid "+T.line,marginTop:12,paddingTop:10}}>
          <div style={{fontSize:12,fontWeight:700,color:T.muted,marginBottom:7}}>NUOVA RILEVAZIONE · {today()}</div>
          <input placeholder="Revolut (conto deposito)" value={rev} onChange={e=>setRev(e.target.value)} inputMode="decimal" style={sel2} />
          <input placeholder="Fineco (investimenti)" value={fin} onChange={e=>setFin(e.target.value)} inputMode="decimal" style={{...sel2,marginTop:7}} />
          <input placeholder="Intesa Sanpaolo" value={int} onChange={e=>setInt(e.target.value)} inputMode="decimal" style={{...sel2,marginTop:7}} />
          <div style={{marginTop:9}}><Btn kind="ghost" onClick={addSnapshot}>Salva rilevazione</Btn></div>

      {delBalance && (

          <Card style={{maxWidth:340}}>
            <div style={{fontSize:16,fontWeight:700,marginBottom:8}}>Eliminare questa rilevazione?</div>
            <div style={{fontSize:14,lineHeight:1.5,marginBottom:16}}>
              <b>{delBalance.date}</b><br/>Revolut {eur(delBalance.revolut)} · Fineco {eur(delBalance.fineco)} · Intesa {eur(delBalance.intesa)}
            </div>
            <div style={{display:"flex",gap:8}}>
              <Btn kind="ghost" onClick={()=>setDelBalance(null)}>Annulla</Btn>
              <Btn kind="danger" onClick={()=>{
                fb.deleteDoc(fb.doc(fb.db,"balances",delBalance.id)).catch(e=>say("Errore: "+(e.code||e.message)));
                say("Rilevazione eliminata"); setDelBalance(null);
              }}>Elimina</Btn>
            </div>
          </Card>
        </div>
      )}

      <H>3 · Differenza entrate meno uscite {scale==="mese"?"per mese":"per anno"}</H>
      <Card>
        <Bars rows={byPeriod.map(r=>({...r,netto:r.entrate-r.fisse-r.variabili}))} keys={["netto"]}
          colors={(r)=>r.netto<0?T.out:T.in} labelKey="k" />
        <div style={{fontSize:11,color:T.muted,marginBottom:2}}>■ verde se il periodo chiude in attivo, ■ rosso se in passivo</div>
      </Card>
      <Card style={{marginTop:8}}>
        <Tab head={[scale==="mese"?"Mese":"Anno","Entrate","~100","Uscite","~100","Netto","~100"]}
          rows={[...byPeriod].reverse().map(r=>{const u=r.fisse+r.variabili,n=r.entrate-u;
            return [longLab(r.k),eur(r.entrate),eur0(round100(r.entrate)),eur(u),eur0(round100(u)),eur(n),eur0(round100(n))];})} />
      </Card>

      <AnalisiCategoria {...{cats,mine,meta,scale,pkey,shortLab,longLab,Bars,Tab,
        onData:(d)=>{analisiRef.current=d;}}} />

      <RiepilogoViaggio condivisioni={condivisioni} />

      <div style={{margin:"16px 0 4px"}}><Btn onClick={()=>{
        const titoloPrecedente=document.title;
        try{
          const el=document.getElementById("print-root");
          el.innerHTML=buildPrintHTML({userName:USERS[user],scale,byPeriod,balances,contiVis,analysis:analisiRef.current});
          // molti browser usano il titolo della pagina come nome suggerito per "Salva come PDF".
          // su iOS window.print() NON aspetta che l'utente chiuda la finestra di stampa/condivisione:
          // ripristinare il titolo troppo presto (subito dopo la chiamata) vanificava la modifica.
          // lo si tiene per qualche secondo, il tempo che il sistema lo legga per il nome del file.
          document.title="Spendometro_Report_"+USERS[user]+"_"+today();
          window.print();
          setTimeout(()=>{ document.title=titoloPrecedente; },4000);
        }catch(e){ say("Stampa non disponibile"); document.title=titoloPrecedente; }
      }}>Condividi report in PDF</Btn></div>
      <div style={{fontSize:11.5,color:T.muted,lineHeight:1.5,paddingBottom:10}}>Su iPhone si apre la stampa: pizzica per ingrandire l'anteprima, poi usa Condividi per inviare il PDF via mail.</div>
    </div>
  );
}

/* ---------- Analisi per categoria: selezione multipla, confronto fianco a fianco, filtro etichetta ---------- */
const PALETTE_SERIE=["#1F3A5F","#7A5AA8","#B8860B","#0E8A6A","#C0432C"];
const MAX_NODI=5;
const L2S_ANALISI=[["fisse","Fisse"],["variabili","Variabili"],["stipendio","Stipendio"],["altre_entrate","Altre entrate"]];

function NodeRow({label,indent,hasChildren,expanded,onToggleExp,selected,onToggleSel,disabled,swatch}){
  return (
    <div style={{display:"flex",alignItems:"center",gap:6,padding:"6px 4px",marginLeft:indent*16,opacity:disabled?0.4:1}}>
      {hasChildren ? (
        <button onClick={onToggleExp} style={{background:"none",border:"none",padding:2,display:"flex",color:T.muted}}>
          <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.6" strokeLinecap="round" strokeLinejoin="round"
            style={{transform:expanded?"rotate(90deg)":"none",transition:"transform .12s"}}><path d="M9 6l6 6-6 6"/></svg>
        </button>
      ) : <span style={{width:13}} />}
      <button onClick={disabled?undefined:onToggleSel} disabled={disabled}
        style={{width:18,height:18,flex:"0 0 auto",borderRadius:5,border:"2px solid "+(selected?(swatch||T.brand):T.line),
        background:selected?(swatch||T.brand):"#fff"}} />
      <button onClick={hasChildren?onToggleExp:(disabled?undefined:onToggleSel)} disabled={disabled&&!hasChildren}
        style={{background:"none",border:"none",padding:0,textAlign:"left",flex:1,fontSize:13,color:T.ink,fontWeight:selected?700:400}}>{label}</button>
    </div>
  );
}

function AnalisiCategoria({cats,mine,meta,scale,pkey,shortLab,longLab,Bars,Tab,onData}){
  const [exp,setExp]=useState(()=>new Set());
  const [nodi,setNodi]=useState([]);          // [{id,name}], ordine = ordine di selezione = ordine colori
  const [etFiltro,setEtFiltro]=useState("");
  const [selPeriod,setSelPeriod]=useState(null);  // periodo toccato nel grafico: la tabella parte vuota finche' non lo scegli
  const toggleExp=(k)=>setExp(s=>{const n=new Set(s); n.has(k)?n.delete(k):n.add(k); return n;});
  const isSel=(id)=>nodi.some(n=>n.id===id);
  const toggleSel=(id,name)=>setNodi(list=>{
    if(list.some(n=>n.id===id)) return list.filter(n=>n.id!==id);
    if(list.length>=MAX_NODI) return list;
    return [...list,{id,name}];
  });

  const etichetteDisponibili=useMemo(()=>[...new Set(mine.map(x=>(x.t.etichetta||"").trim()).filter(Boolean))].sort(),[mine]);

  // ogni movimento appartiene a piu' nodi contemporaneamente (uno per livello): L1, L2, L3, L4, L5
  const nodiDi=(t)=>{
    const {leaf,group,sub}=meta(t); if(!group) return [];
    const ids=["L1:"+group.l1,"L2:"+group.l2,"L3:"+group.id];
    if(leaf) ids.push("L4:"+leaf.id);
    if(sub) ids.push("L5:"+sub.id);
    return ids;
  };

  const attivo = nodi.length>0 || etFiltro.trim();
  const etF = etFiltro.trim().toLowerCase();
  useEffect(()=>{ setSelPeriod(null); },[nodi,etF,scale]);  // una nuova selezione azzera il periodo scelto prima

  const {rows,movimenti}=useMemo(()=>{
    if(!attivo) return {rows:[],movimenti:[]};
    const periodi={};
    const movs=[];
    mine.forEach(({t,q})=>{
      if(etF && (t.etichetta||"").trim().toLowerCase()!==etF) return;
      const ids=nodiDi(t);
      const match = nodi.length ? nodi.filter(n=>ids.includes(n.id)) : [{id:"ALL",name:"Totale"}];
      if(!match.length) return;
      const pk=pkey(t.date);
      periodi[pk]=periodi[pk]||{k:pk};
      match.forEach(m=>{ periodi[pk][m.id]=(periodi[pk][m.id]||0)+q; });
      movs.push({t,q,cats:match.map(m=>m.name)});
    });
    const rows=Object.values(periodi).sort((a,b)=>a.k.localeCompare(b.k));
    movs.sort((a,b)=>b.t.date.localeCompare(a.t.date));
    return {rows,movimenti:movs};
  },[mine,nodi,etF,scale]);

  const serie = nodi.length ? nodi : (attivo ? [{id:"ALL",name:"Totale"}] : []);
  const keys = serie.map(s=>s.id);
  const totali = Object.fromEntries(serie.map(s=>[s.id, rows.reduce((sum,r)=>sum+(r[s.id]||0),0)]));

  useEffect(()=>{
    if(onData) onData({active:attivo,serie,rows,totali,movimenti,scale,longLab});
  },[attivo,rows,movimenti]);

  return (<>
    <H>4 · Analisi per categoria</H>
    <Card>
      <div style={{fontSize:12.5,color:T.muted,marginBottom:9,lineHeight:1.5}}>
        Seleziona una o più categorie (a qualsiasi livello) per confrontarle fianco a fianco, e/o filtra per etichetta per un evento specifico come un viaggio.
      </div>
      <div style={{maxHeight:280,overflowY:"auto",border:"1px solid "+T.line,borderRadius:10,padding:"4px 6px"}}>
        {L2S_ANALISI.map(([l2,l2label])=>{
          const l2id="L2:"+l2;
          const groups=cats.groups.filter(g=>g.l2===l2 && !g.archived);
          const disL2 = !isSel(l2id) && nodi.length>=MAX_NODI;
          return (
            <div key={l2}>
              <NodeRow label={l2label} indent={0} hasChildren={groups.length>0} expanded={exp.has(l2id)}
                onToggleExp={()=>toggleExp(l2id)} selected={isSel(l2id)} onToggleSel={()=>toggleSel(l2id,l2label)}
                disabled={disL2} swatch={isSel(l2id)?PALETTE_SERIE[nodi.findIndex(n=>n.id===l2id)]:null} />
              {exp.has(l2id) && groups.map(g=>{
                const l3id="L3:"+g.id;
                const leaves=cats.leaves.filter(l=>l.groupId===g.id && !l.archived);
                const disL3 = !isSel(l3id) && nodi.length>=MAX_NODI;
                return (
                  <div key={g.id}>
                    <NodeRow label={g.icon+" "+g.name} indent={1} hasChildren={leaves.length>0} expanded={exp.has(l3id)}
                      onToggleExp={()=>toggleExp(l3id)} selected={isSel(l3id)} onToggleSel={()=>toggleSel(l3id,l2label+" › "+g.name)}
                      disabled={disL3} swatch={isSel(l3id)?PALETTE_SERIE[nodi.findIndex(n=>n.id===l3id)]:null} />
                    {exp.has(l3id) && leaves.map(l=>{
                      const l4id="L4:"+l.id;
                      const subs=(cats.subs||[]).filter(x=>x.leafId===l.id && !x.archived);
                      const disL4 = !isSel(l4id) && nodi.length>=MAX_NODI;
                      return (
                        <div key={l.id}>
                          <NodeRow label={l.name} indent={2} hasChildren={subs.length>0} expanded={exp.has(l4id)}
                            onToggleExp={()=>toggleExp(l4id)} selected={isSel(l4id)} onToggleSel={()=>toggleSel(l4id,g.name+" › "+l.name)}
                            disabled={disL4} swatch={isSel(l4id)?PALETTE_SERIE[nodi.findIndex(n=>n.id===l4id)]:null} />
                          {exp.has(l4id) && subs.map(x=>{
                            const l5id="L5:"+x.id;
                            const disL5 = !isSel(l5id) && nodi.length>=MAX_NODI;
                            return (
                              <NodeRow key={x.id} label={x.name} indent={3} hasChildren={false} expanded={false}
                                onToggleExp={()=>{}} selected={isSel(l5id)} onToggleSel={()=>toggleSel(l5id,l.name+" › "+x.name)}
                                disabled={disL5} swatch={isSel(l5id)?PALETTE_SERIE[nodi.findIndex(n=>n.id===l5id)]:null} />
                            );
                          })}
                        </div>
                      );
                    })}
                  </div>
                );
              })}
            </div>
          );
        })}
      </div>
      {nodi.length>=MAX_NODI && <div style={{fontSize:11.5,color:T.muted,marginTop:6}}>Massimo {MAX_NODI} categorie a confronto contemporaneamente.</div>}

      <div style={{marginTop:11}}>
        <div style={{fontSize:12,fontWeight:700,color:T.muted,marginBottom:5}}>FILTRA PER ETICHETTA (facoltativo)</div>
        <EtichettaInput value={etFiltro} onChange={setEtFiltro} options={etichetteDisponibili} placeholder="Es. Viaggio in Giappone" />
      </div>

      {nodi.length>0 && (
        <div style={{display:"flex",flexWrap:"wrap",gap:6,marginTop:10}}>
          {nodi.map((n,i)=>(
            <span key={n.id} style={{display:"flex",alignItems:"center",gap:5,background:T.bg,borderRadius:14,padding:"4px 9px",fontSize:12}}>
              <span style={{width:9,height:9,borderRadius:2,background:PALETTE_SERIE[i]}} />
              {n.name}
              <button onClick={()=>toggleSel(n.id,n.name)} style={{background:"none",border:"none",color:T.muted,fontSize:14,lineHeight:1,padding:0}}>✕</button>
            </span>
          ))}
        </div>
      )}
    </Card>

    {attivo && (
      <>
        <Card style={{marginTop:8}}>
          {rows.length===0 ? <div style={{fontSize:13.5,color:T.muted,padding:"6px 0"}}>Nessun movimento per questa selezione.</div> : (<>
            <Bars rows={rows} keys={keys} colors={serie.map((_,i)=>PALETTE_SERIE[i])} labelKey="k"
              onBarClick={setSelPeriod} activeKey={selPeriod} />
            <div style={{display:"flex",flexWrap:"wrap",gap:10,fontSize:11,color:T.muted,marginTop:2}}>
              {serie.map((sname,i)=>(
                <span key={sname.id}>■ {sname.name}: <b style={{color:T.ink}}>{eur(totali[sname.id]||0)}</b></span>
              ))}
            </div>
            <div style={{fontSize:11,color:T.muted,marginTop:6,textAlign:"center"}}>{selPeriod?"Tocca un altro periodo per cambiarlo":"Tocca un periodo per vederne i movimenti"}</div>
          </>)}
        </Card>

        {selPeriod && (
          <Card style={{marginTop:8,padding:"4px 14px"}}>
            <div style={{fontSize:11,letterSpacing:1.2,textTransform:"uppercase",color:T.muted,fontWeight:700,padding:"9px 0 3px"}}>
              {longLab(selPeriod)} · {movimenti.filter(m=>pkey(m.t.date)===selPeriod).length} movimenti
            </div>
            {movimenti.filter(m=>pkey(m.t.date)===selPeriod).length===0 && (
              <div style={{padding:"14px 0",fontSize:13.5,color:T.muted}}>Nessun movimento in questo periodo.</div>
            )}
            {movimenti.filter(m=>pkey(m.t.date)===selPeriod).map(({t,q,cats:catNames})=>{
              const {leaf,group,sub}=meta(t);
              return (
                <div key={t.id} style={{display:"flex",gap:10,alignItems:"center",padding:"9px 0",borderBottom:"1px solid "+T.line}}>
                  <div style={{fontSize:18}}>{group?group.icon:"📌"}</div>
                  <div style={{flex:1,minWidth:0}}>
                    <div style={{fontSize:13.5,fontWeight:600,whiteSpace:"nowrap",overflow:"hidden",textOverflow:"ellipsis"}}>
                      {sub?sub.name:(leaf?leaf.name:(group?group.name:"?"))}{t.note?<span style={{color:T.muted,fontWeight:400}}> · {t.note}</span>:null}
                    </div>
                    <div style={{fontSize:11,color:T.muted}}>{t.date.slice(8,10)}/{t.date.slice(5,7)}/{t.date.slice(0,4)} · {catNames.join(", ")}</div>
                    {t.etichetta && <div style={{fontSize:11,color:"#7A5AA8",fontWeight:700}}>{t.etichetta}</div>}
                  </div>
                  <div style={{fontWeight:700,fontSize:13.5,color:t.type==="income"?T.in:T.out,fontVariantNumeric:"tabular-nums"}}>{t.type==="income"?"+":"−"}{eur(q).slice(1)}</div>
                </div>
              );
            })}
          </Card>
        )}
      </>
    )}
  </>);
}

/* ---------- Categorie ---------- */
function CatsView({cats,saveCats,tx,say}){
  const [l2,setL2]=useState("fisse");
  const [newLeaf,setNewLeaf]=useState({});
  const [newGroup,setNewGroup]=useState("");
  const [picking,setPicking]=useState(null);
  const count=(leafId)=>tx.filter(t=>t.leafId===leafId).length;
  const gcount=(gid)=>tx.filter(t=>t.groupId===gid).length;
  const scount=(sid)=>tx.filter(t=>t.subId===sid).length;
  const subs=cats.subs||[];
  const addSub=(lid)=>{const n=(newLeaf["s"+lid]||"").trim();if(!n)return;
    saveCats({...cats,subs:[...subs,{id:lid+"."+slug(n)+"_"+Date.now(),leafId:lid,name:n,archived:false}]});
    setNewLeaf({...newLeaf,["s"+lid]:""});say("Dettaglio aggiunto");};

  const rename=(kind,id,name)=>{
    if(!name||!name.trim()) return;
    saveCats(kind==="g"
      ?{...cats,groups:cats.groups.map(g=>g.id===id?{...g,name:name.trim()}:g)}
      :{...cats,leaves:cats.leaves.map(l=>l.id===id?{...l,name:name.trim()}:l)});
    say("Rinominata, lo storico si aggiorna da solo");
  };
  const addLeaf=(gid)=>{const n=(newLeaf[gid]||"").trim();if(!n)return;
    saveCats({...cats,leaves:[...cats.leaves,{id:gid+"."+slug(n)+"_"+Date.now(),groupId:gid,name:n,archived:false}]});
    setNewLeaf({...newLeaf,[gid]:""});say("Voce aggiunta");};
  const addGroup=()=>{const n=newGroup.trim();if(!n)return;
    const l1=(l2==="fisse"||l2==="variabili")?"spese":"entrate";
    saveCats({...cats,groups:[...cats.groups,{id:l2+"."+slug(n)+"_"+Date.now(),l1,l2,name:n,icon:autoEmoji(n),archived:false}]});
    setNewGroup("");say("Gruppo aggiunto con emoji "+autoEmoji(n));};
  const removeLeaf=(l)=>{
    if(count(l.id)>0){ saveCats({...cats,leaves:cats.leaves.map(x=>x.id===l.id?{...x,archived:!x.archived}:x)});
      say(l.archived?"Voce riattivata":"Archiviata: ha "+count(l.id)+" movimenti collegati"); }
    else { saveCats({...cats,leaves:cats.leaves.filter(x=>x.id!==l.id)}); say("Voce eliminata"); }};
  const removeGroup=(g)=>{
    const n=gcount(g.id);
    if(n>0){ saveCats({...cats,groups:cats.groups.map(x=>x.id===g.id?{...x,archived:!x.archived}:x)});
      say(g.archived?"Gruppo riattivato":"Archiviato: ha "+n+" movimenti"); }
    else { saveCats({...cats,groups:cats.groups.filter(x=>x.id!==g.id),leaves:cats.leaves.filter(x=>x.groupId!==g.id)}); say("Gruppo eliminato"); }};

  return (
    <div style={{paddingTop:14}}>
      <div style={{fontSize:19,fontWeight:800,marginBottom:4}}>Categorie</div>
      <div style={{fontSize:12.5,color:T.muted,marginBottom:12}}>Livelli 1 e 2 fissi. Gruppi e voci si aggiungono e rinominano; la rinomina è retroattiva su tutto lo storico.</div>
      <div style={{display:"flex",gap:5,marginBottom:12,flexWrap:"wrap"}}>
        {Object.keys(TREE).map(k=>(
          <button key={k} onClick={()=>setL2(k)} style={{padding:"7px 11px",borderRadius:18,border:"1px solid "+(l2===k?T.brand:T.line),background:l2===k?T.brandSoft:T.surface,fontSize:12.5,fontWeight:600}}>{L2LABEL[k]}</button>
        ))}
      </div>
      {cats.groups.filter(g=>g.l2===l2).map(g=>(
        <Card key={g.id} style={{marginBottom:9,opacity:g.archived?0.5:1}}>
          <div style={{display:"flex",alignItems:"center",gap:8}}>
            <button onClick={()=>setPicking(picking===g.id?null:g.id)} style={{fontSize:19,background:picking===g.id?T.brandSoft:"none",border:"1px solid "+(picking===g.id?T.brand:T.line),borderRadius:8,padding:"3px 7px"}}>{g.icon}</button>
            <input defaultValue={g.name} onBlur={e=>e.target.value!==g.name&&rename("g",g.id,e.target.value)} style={{flex:1,border:"none",fontSize:15,fontWeight:700,background:"none",color:T.ink,minWidth:0}} />
            <button onClick={()=>removeGroup(g)} style={{background:"none",border:"1px solid "+T.line,borderRadius:7,fontSize:11,padding:"3px 7px",color:T.muted}}>{gcount(g.id)>0?(g.archived?"riattiva":"archivia"):"elimina"}</button>
          </div>
          {picking===g.id && (
            <div style={{display:"flex",flexWrap:"wrap",gap:4,marginTop:8,padding:8,background:T.bg,borderRadius:9,maxHeight:150,overflowY:"auto"}}>
              {PALETTE.map((e,i)=><button key={i} onClick={()=>{saveCats({...cats,groups:cats.groups.map(x=>x.id===g.id?{...x,icon:e}:x)});setPicking(null);say("Emoji aggiornata");}} style={{fontSize:18,background:"none",border:"none",padding:2}}>{e}</button>)}
            </div>
          )}
          <div style={{marginTop:8}}>
            {cats.leaves.filter(l=>l.groupId===g.id).map(l=>(
            <React.Fragment key={l.id}>
              <div style={{display:"flex",alignItems:"center",gap:6,padding:"5px 0",borderTop:"1px solid "+T.line,opacity:l.archived?0.45:1}}>
                <input defaultValue={l.name} onBlur={e=>e.target.value!==l.name&&rename("l",l.id,e.target.value)} style={{flex:1,border:"none",fontSize:13.5,background:"none",color:T.ink,minWidth:0}} />
                <span style={{fontSize:11,color:T.muted}}>{count(l.id)}</span>
                <button onClick={()=>removeLeaf(l)} style={{background:"none",border:"1px solid "+T.line,borderRadius:7,fontSize:11,padding:"3px 7px",color:T.muted}}>{count(l.id)>0?(l.archived?"riattiva":"archivia"):"elimina"}</button>
              </div>
              {(subs.filter(x=>x.leafId===l.id).length>0 || newLeaf["s"+l.id]!==undefined) && (
                <div style={{marginLeft:14,paddingLeft:8,borderLeft:"2px solid "+T.brandSoft}}>
                  {subs.filter(x=>x.leafId===l.id).map(x=>(
                    <div key={x.id} style={{display:"flex",alignItems:"center",gap:6,padding:"3px 0"}}>
                      <input defaultValue={x.name} onBlur={e=>e.target.value!==x.name&&saveCats({...cats,subs:subs.map(y=>y.id===x.id?{...y,name:e.target.value.trim()}:y)})}
                        style={{flex:1,border:"none",fontSize:12.5,background:"none",color:T.brand,minWidth:0}} />
                      <span style={{fontSize:10.5,color:T.muted}}>{scount(x.id)}</span>
                      <button onClick={()=>{ if(scount(x.id)>0) saveCats({...cats,subs:subs.map(y=>y.id===x.id?{...y,archived:!y.archived}:y)});
                          else saveCats({...cats,subs:subs.filter(y=>y.id!==x.id)}); }}
                        style={{background:"none",border:"1px solid "+T.line,borderRadius:6,fontSize:10,padding:"2px 6px",color:T.muted}}>{scount(x.id)>0?(x.archived?"riattiva":"archivia"):"elimina"}</button>
                    </div>
                  ))}
                  <div style={{display:"flex",gap:5,marginTop:4}}>
                    <input placeholder="Nuovo dettaglio…" value={newLeaf["s"+l.id]||""} onChange={e=>setNewLeaf({...newLeaf,["s"+l.id]:e.target.value})}
                      style={{...sel2,padding:"5px 8px",fontSize:12.5}} />
                    <button onClick={()=>addSub(l.id)} style={{background:T.brandSoft,border:"1px solid "+T.brand,color:T.brand,borderRadius:8,padding:"0 10px",fontWeight:700,fontSize:13}}>+</button>
                  </div>
                </div>
              )}
              {subs.filter(x=>x.leafId===l.id).length===0 && newLeaf["s"+l.id]===undefined && (
                <button onClick={()=>setNewLeaf({...newLeaf,["s"+l.id]:""})}
                  style={{background:"none",border:"none",color:T.brand,fontSize:11,padding:"2px 0 4px 14px"}}>+ aggiungi dettaglio</button>
              )}
            </React.Fragment>
            ))}
            <div style={{display:"flex",gap:6,marginTop:7}}>
              <input placeholder="Nuova voce…" value={newLeaf[g.id]||""} onChange={e=>setNewLeaf({...newLeaf,[g.id]:e.target.value})} style={{...sel2,padding:"7px 9px",fontSize:14}} />
              <button onClick={()=>addLeaf(g.id)} style={{background:T.brandSoft,border:"1px solid "+T.brand,color:T.brand,borderRadius:9,padding:"0 13px",fontWeight:700}}>+</button>
            </div>
          </div>
        </Card>
      ))}
      <Card style={{marginBottom:10}}>
        <div style={{fontSize:12,fontWeight:700,color:T.muted,marginBottom:7}}>NUOVO GRUPPO IN {L2LABEL[l2].toUpperCase()}</div>
        <div style={{display:"flex",gap:6}}>
          <input placeholder="Nome gruppo…" value={newGroup} onChange={e=>setNewGroup(e.target.value)} style={{...sel2,padding:"8px 10px",fontSize:14}} />
          <button onClick={addGroup} style={{background:T.brandSoft,border:"1px solid "+T.brand,color:T.brand,borderRadius:9,padding:"0 14px",fontWeight:700}}>+</button>
        </div>
      </Card>
    </div>
  );
}

/* ---------- Dati ---------- */
const CSVHEAD=["Data","Tipo","Importo","L2","L3","L4","L5","Etichetta","Nota","Split","Quota","InseritoDa"];

function SchermataDati({tx,cats,meta,user,fb,doBackup,config,photo,setSimLock,say,detachTx,attachTx}){
  const [imp,setImp]=useState(null);
  const [busy,setBusy]=useState(false);
  const [prog,setProg]=useState(null);
  const [confermaImport,setConfermaImport]=useState(false);
  const [nServer,setNServer]=useState(null);
  const apriConferma=async()=>{
    setNServer(null); setConfermaImport(true);
    try{ const s=await fb.getCountFromServer(fb.collection(fb.db,"transactions")); setNServer(s.data().count); }
    catch(e){ setNServer(tx.length); }
  };

  const exportCSV=(all)=>{
    const rows=(all?tx:tx.filter(t=>shareFor(t,user)>0)).map(t=>{
      const {leaf,group,sub}=meta(t);
      return [t.date,t.type==="income"?"Entrata":"Spesa",t.amount.toFixed(2),
        group?group.l2:"",group?group.name:"",leaf?leaf.name:"",sub?sub.name:"",
        t.etichetta||"",t.note||"",t.shared?t.splitMode:"",t.shared?t.splitPercent:50,t.createdBy];
    });
    const csv="\uFEFF"+[CSVHEAD,...rows].map(r=>r.map(c=>'"'+String(c??"").replace(/"/g,'""')+'"').join(";")).join("\n");
    const how=shareOrDownload(new Blob([csv],{type:"text/csv"}),
      "SPENDOMETRO_"+(all?"completo":"mio")+"_"+today()+".csv","Export Spendometro");
    say(how==="fallback"?"Export non riuscito qui, riprova dal telefono":"CSV generato");
  };

  const onPhoto=(e)=>{
    const file=e.target.files[0]; if(!file) return;
    const rd=new FileReader();
    rd.onload=()=>{
      const img=new Image();
      img.onload=()=>{
        const MAXW=1000, MAXH=520;
        let w=img.width,h=img.height;
        const sc=Math.min(MAXW/w,MAXH/h,1); w=Math.round(w*sc); h=Math.round(h*sc);
        const cv=document.createElement("canvas"); cv.width=w; cv.height=h;
        cv.getContext("2d").drawImage(img,0,0,w,h);
        let q=0.72,url=cv.toDataURL("image/jpeg",q);
        while(url.length>700000&&q>0.32){ q-=0.1; url=cv.toDataURL("image/jpeg",q); }
        if(url.length>900000) return say("Foto troppo pesante, provane una piu piccola");
        try{ fb.setDoc(fb.doc(fb.db,"meta","photo"),{dataUrl:url,updatedBy:user,updatedAt:fb.serverTimestamp()})
            .catch(err=>say("Sincronizzazione foto non riuscita: "+(err.code||err.message)));
          say("Foto aggiornata per entrambi"); }catch(err){ say("Errore: "+(err.code||err.message)); }
      };
      img.onerror=()=>say("Immagine non leggibile");
      img.src=rd.result;
    };
    rd.readAsDataURL(file);
  };

  const parseCSV=(text)=>{
    text=text.replace(/^\uFEFF/,"");
    // separatore dedotto dalla prima riga: il piu' frequente fuori dalle virgolette
    const testa=text.split(/\r?\n/)[0].replace(/"[^"]*"/g,"");
    const SEP=(testa.split(";").length>=testa.split(",").length)?";":",";
    const rows=[];let cur=[],f="",q=false;
    for(let i=0;i<text.length;i++){const c=text[i];
      if(q){ if(c==='"'&&text[i+1]==='"'){f+='"';i++;} else if(c==='"'){q=false;} else f+=c; }
      else { if(c==='"')q=true; else if(c===SEP){cur.push(f);f="";}
        else if(c==="\n"){cur.push(f);rows.push(cur);cur=[];f="";}
        else if(c!=="\r") f+=c; } }
    if(f||cur.length){cur.push(f);rows.push(cur);}
    return rows.filter(r=>r.some(x=>x!==""));
  };

  const onFile=(e)=>{
    const file=e.target.files[0]; if(!file) return;
    const r=new FileReader();
    r.onload=()=>{ try{
      const rows=parseCSV(String(r.result));
      const head=rows[0].map(h=>h.trim());
      const ix=Object.fromEntries(CSVHEAD.map(h=>[h,head.findIndex(x=>x.toLowerCase()===h.toLowerCase())]));
      if(ix.Data<0||ix.Importo<0||ix.L2<0) return say("Intestazione non riconosciuta");
      const recs=rows.slice(1).map(r=>({
        date:(r[ix.Data]||"").slice(0,10),
        type:(r[ix.Tipo]||"").toLowerCase().startsWith("entrat")?"income":"expense",
        amount:Math.abs(parseFloat(String(r[ix.Importo]).replace(",","."))||0),
        l2:(r[ix.L2]||"").trim(), l3:(r[ix.L3]||"").trim(),
        l4:(r[ix.L4]||"").trim(), l5:(ix.L5>=0?(r[ix.L5]||""):"").trim(),
        etichetta:(ix.Etichetta>=0?(r[ix.Etichetta]||""):"").trim(),
        note:(r[ix.Nota]||"").trim(),
        splitMode:(r[ix.Split]||"").trim()||null,
        splitPercent:parseInt(r[ix.Quota])||50,
        createdBy:(r[ix.InseritoDa]||user).trim().toLowerCase(),
      })).filter(x=>x.date&&x.amount>0);
      setImp({name:file.name,recs});
      say("Letto "+file.name+": "+recs.length+" righe");
    }catch(err){ say("File non leggibile"); } };
    r.readAsText(file);
  };

  const cancelRef=useRef(false);
  const withTimeout=(p,ms,label)=>Promise.race([p,
    new Promise((_,rej)=>setTimeout(()=>rej(new Error("timeout: "+label)),ms))]);
  const attesa=(ms)=>new Promise(r=>setTimeout(r,ms));

  const doImport=async(sostituisci)=>{
    if(!imp) return;
    if(!navigator.onLine) return say("L'import richiede la connessione");
    setConfermaImport(false);           // chiude subito la finestra di conferma
    cancelRef.current=false;
    detachTx();                          // stacco davvero l'ascolto, non solo lo ignoro
    setBusy(true); setProg({fase:"preparo",fatti:0,tot:imp.recs.length});
    try{
      // 1) tassonomia: costruita a piccoli lotti, con pause, cosi' l'interfaccia resta viva
      let cs=buildCats();
      const gIndex=new Map(cs.groups.map(g=>[g.l2+"|"+g.name.toLowerCase(),g]));
      const lIndex=new Map(cs.leaves.map(l=>[l.groupId+"|"+l.name.toLowerCase(),l]));
      const sIndex=new Map(cs.subs.map(x=>[x.leafId+"|"+x.name.toLowerCase(),x]));
      const docs=[];
      const LOTTO=300;
      for(let i=0;i<imp.recs.length;i++){
        if(cancelRef.current) throw new Error("annullato");
        const r=imp.recs[i];
        const l2=["fisse","variabili","stipendio","altre_entrate"].includes(r.l2)?r.l2:(r.type==="income"?"altre_entrate":"variabili");
        const l3n=(r.l3||"Altro"); const gk=l2+"|"+l3n.toLowerCase();
        let g=gIndex.get(gk);
        if(!g){ g={id:l2+"."+slug(l3n)+"_"+Math.random().toString(36).slice(2,7),
          l1:(l2==="fisse"||l2==="variabili")?"spese":"entrate",l2,name:l3n,
          icon:autoEmoji(l3n),archived:false}; cs.groups.push(g); gIndex.set(gk,g); }
        let lf=null;
        if(r.l4){ const lk=g.id+"|"+r.l4.toLowerCase(); lf=lIndex.get(lk);
          if(!lf){ lf={id:g.id+"."+slug(r.l4)+"_"+Math.random().toString(36).slice(2,7),groupId:g.id,name:r.l4,archived:false};
            cs.leaves.push(lf); lIndex.set(lk,lf); } }
        let sb=null;
        if(r.l5&&lf){ const sk=lf.id+"|"+r.l5.toLowerCase(); sb=sIndex.get(sk);
          if(!sb){ sb={id:lf.id+"."+slug(r.l5)+"_"+Math.random().toString(36).slice(2,7),leafId:lf.id,name:r.l5,archived:false};
            cs.subs.push(sb); sIndex.set(sk,sb); } }
        docs.push({date:r.date,type:r.type,amount:r.amount,groupId:g.id,leafId:lf?lf.id:null,
          subId:sb?sb.id:null,note:r.note,etichetta:r.etichetta,
          shared:!!r.splitMode,splitMode:r.splitMode,splitPercent:r.splitPercent,
          createdBy:USERS[r.createdBy]?r.createdBy:user,editedBy:null,source:"import"});
        if(i%LOTTO===0){ setProg({fase:"preparo",fatti:i,tot:imp.recs.length}); await attesa(0); }
      }

      // 2) svuota, se richiesto: legge SEMPRE l'elenco vero dal server (mai la cache locale,
      //    che potrebbe essere disallineata dopo operazioni fatte fuori dall'app)
      if(sostituisci){
        setProg({fase:"svuoto",fatti:0,tot:1});
        const snap=await withTimeout(fb.getDocsFromServer(fb.collection(fb.db,"transactions")),45000,"lettura elenco da eliminare");
        const idsDaEliminare=snap.docs.map(d=>d.id);
        for(let i=0;i<idsDaEliminare.length;i+=300){
          if(cancelRef.current) throw new Error("annullato");
          setProg({fase:"svuoto",fatti:i,tot:idsDaEliminare.length});
          const b=fb.writeBatch(fb.db);
          idsDaEliminare.slice(i,i+300).forEach(id=>b.delete(fb.doc(fb.db,"transactions",id)));
          await withTimeout(b.commit(),45000,"eliminazione lotto");
        }
      }

      // 3) categorie, poi movimenti a lotti con tempo massimo
      await withTimeout(fb.setDoc(fb.doc(fb.db,"meta","categories"),cs),45000,"categorie");
      for(let i=0;i<docs.length;i+=300){
        if(cancelRef.current) throw new Error("annullato");
        setProg({fase:"carico",fatti:i,tot:docs.length});
        const b=fb.writeBatch(fb.db);
        docs.slice(i,i+300).forEach(d=>b.set(fb.doc(fb.collection(fb.db,"transactions")),d));
        await withTimeout(b.commit(),45000,"caricamento lotto");
      }
      setProg({fase:"fatto",fatti:docs.length,tot:docs.length});
      say("Importati "+docs.length+" movimenti"); setImp(null);
    }catch(e){
      const msg=String(e.message||e.code||e);
      say(msg.includes("annullato")?"Import annullato":
          msg.includes("timeout")?"Connessione troppo lenta, riprova ("+msg+")":
          "Errore import: "+msg);
    }
    attachTx();                          // ricollego: un solo aggiornamento con il risultato finale
    setBusy(false); setProg(null); cancelRef.current=false;
  };

    return (
    <div style={{paddingTop:14}}>
      <H>Dati e backup</H>
      <Card>
        <Row l="Movimenti in archivio" r={tx.length} />
        <Row l="In attesa di sincronizzazione" r={tx.filter(t=>t.pending).length} />
        <Row l="Etichette in uso" r={[...new Set(tx.map(t=>(t.etichetta||"").trim()).filter(Boolean))].length} />
        <Row l="Stato" r={navigator.onLine?"connesso":"offline"} />
        <div style={{marginTop:9}}><Btn kind="ghost" onClick={async()=>{
          try{ const s=await fb.getCountFromServer(fb.collection(fb.db,"transactions"));
            say("Sul server risultano "+s.data().count+" movimenti"); }
          catch(e){ say("Non raggiungo il server: "+(e.code||e.message)); } }}>Verifica quanti movimenti ci sono sul server</Btn></div>
        <Row l="Ultimo backup" r={config.lastBackup||"mai"} />
        <div style={{marginTop:10}}><Btn onClick={doBackup}>Backup database</Btn></div>
        <div style={{fontSize:11.5,color:T.muted,marginTop:8,lineHeight:1.5}}>Genera il JSON completo e apre la condivisione. Scegli Mail e invialo a te stesso.</div>
      </Card>
      <H>Export</H>
      <Card>
        <div style={{display:"flex",flexDirection:"column",gap:8}}>
          <Btn kind="ghost" onClick={()=>exportCSV(true)}>Esporta tutto il database in CSV</Btn>
          <Btn kind="ghost" onClick={()=>exportCSV(false)}>Esporta solo la tua quota</Btn>
        </div>
      </Card>
      <H>Import CSV</H>
      <Card>
        <input type="file" accept=".csv,text/csv" onChange={onFile} style={{fontSize:13}} />
        {imp && (<div style={{marginTop:10}}>
          <div style={{fontSize:12.5,color:T.muted,marginBottom:9}}>{imp.name} · <b>{imp.recs.length}</b> righe pronte.
            Le categorie mancanti vengono create in automatico.</div>
          <div style={{display:"flex",flexDirection:"column",gap:8}}>
            <Btn kind="ghost" disabled={busy} onClick={()=>doImport(false)}>Aggiungi ai movimenti esistenti</Btn>
            <Btn kind="danger" disabled={busy} onClick={apriConferma}>Sostituisci tutto l'archivio</Btn>
          </div>
        </div>)}
        {busy && prog && (
          <div style={{marginTop:12}}>
            <div style={{fontSize:12.5,color:T.brand,fontWeight:700,marginBottom:5}}>
              {({preparo:"Preparo le categorie…",svuoto:"Svuoto l'archivio…",carico:"Carico i movimenti…",fatto:"Fatto"})[prog.fase]}
              {" "}{prog.fatti} / {prog.tot}
            </div>
            <div style={{background:T.bg,borderRadius:8,height:8,overflow:"hidden"}}>
              <div style={{background:T.brand,height:"100%",width:(prog.tot?Math.min(100,Math.round(prog.fatti/prog.tot*100)):0)+"%",transition:"width .2s"}} />
            </div>
            <div style={{marginTop:9}}><Btn kind="ghost" onClick={()=>{cancelRef.current=true;}}>Annulla import</Btn></div>
          </div>
        )}
        <div style={{fontSize:11.5,color:T.muted,marginTop:8,lineHeight:1.5}}>
          Colonne attese: Data, Tipo, Importo, L2, L3, L4, L5, Etichetta, Nota, Split, Quota, InseritoDa. Separatore punto e virgola.</div>
      </Card>

      {confermaImport && !busy && (
        <div style={{position:"fixed",inset:0,background:"rgba(0,0,0,.5)",zIndex:95,display:"flex",alignItems:"center",justifyContent:"center",padding:18}}>
          <Card style={{maxWidth:360}}>
            <div style={{fontSize:16,fontWeight:800,marginBottom:8}}>Sostituire tutto?</div>
            <div style={{fontSize:14,lineHeight:1.5,marginBottom:14}}>
              Verranno eliminati i <b>{nServer===null?"…":nServer}</b> movimenti attuali e caricati i <b>{imp?imp.recs.length:0}</b> del file.
              Anche le categorie tornano a quelle predefinite. Fai prima un backup.</div>
            <div style={{display:"flex",gap:8}}>
              <Btn kind="ghost" onClick={()=>setConfermaImport(false)}>Annulla</Btn>
              <Btn kind="danger" onClick={()=>doImport(true)}>Sostituisci</Btn>
            </div>
          </Card>
        </div>
      )}

      <H>Foto dell'intestazione</H>
      <Card>
        <div style={{fontSize:12.5,color:T.muted,lineHeight:1.5,marginBottom:9}}>Condivisa: la stessa foto compare a te e a {USERS[other(user)]}. Viene ridimensionata automaticamente.</div>
        {photo && <img src={photo} alt="" style={{width:"100%",height:110,objectFit:"cover",borderRadius:10,marginBottom:9}} />}
        <input type="file" accept="image/*" onChange={onPhoto} style={{fontSize:13}} />
        {photo && <div style={{marginTop:9}}><Btn kind="danger" onClick={()=>{try{fb.setDoc(fb.doc(fb.db,"meta","photo"),{dataUrl:null}).catch(e=>say("Non sincronizzato: "+(e.code||e.message)));say("Foto rimossa");}catch(e){say("Errore: "+(e.code||e.message));}}}>Rimuovi foto</Btn></div>}
      </Card>

      <H>Aggiornamenti</H>
      <Card style={{marginBottom:10}}>
        <Row l="Versione installata" r={APP_VERSION} />
        <div style={{marginTop:9,display:"flex",flexDirection:"column",gap:8}}>
          <Btn kind="ghost" onClick={()=>{
            const u=location.href.split("#")[0].split("?")[0]+"?v="+Date.now();
            location.replace(u);}}>Cerca aggiornamenti</Btn>
        </div>
        <div style={{fontSize:11.5,color:T.muted,marginTop:8,lineHeight:1.5}}>Se dopo un aggiornamento del codice la versione non cambia, premi Cerca aggiornamenti.</div>
      </Card>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
})();
</script>
</body>
</html>
